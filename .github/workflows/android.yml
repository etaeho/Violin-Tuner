name: Android APK

# 어느 브랜치든 push 하면 APK를 빌드해서
# 1) Actions 아티팩트로 올리고
# 2) "dev" 프리릴리스에 violin-tuner.apk 로 덮어써서 폰에서 고정 링크로 바로 받을 수 있게 한다.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk violin-tuner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: violin-tuner-${{ github.run_number }}
          path: violin-tuner.apk

      - name: Publish to "dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="브랜치: ${GITHUB_REF_NAME}
          커밋: ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)
          빌드 #${GITHUB_RUN_NUMBER}"
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev violin-tuner.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "개발 빌드 #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "$NOTES"
