<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="mobile-web-app-capable" content="yes" />

  <script>
    // 시작 중 에러가 나면 로딩화면에 표시 (무한 로딩 대신 원인 확인용)
    window.addEventListener('error', (e) => {
      const sp = document.getElementById('splash');
      if (!sp || document.getElementById('splash-error')) return;
      const box = document.createElement('pre');
      box.id = 'splash-error';
      box.style.cssText = 'color:#f87171;font-size:12px;white-space:pre-wrap;padding:16px;max-width:90vw;margin-top:16px';
      box.textContent = '⚠️ 로딩 오류\n' + (e.message || e) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
      sp.appendChild(box);
    });
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);

      -webkit-touch-callout: none;

    html, body {
      height: 100%;

      padding: 0;
      overflow: hidden;

  <script type="text/babel">
    /* =====================================================
       모든 React hooks 및 Lucide 아이콘을 전역에서 가져옴
    ===================================================== */
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      Play, Square, Settings, Volume2, VolumeX, AlertCircle,
      Music, Activity, Minus, Plus, ChevronUp, ChevronDown, RotateCcw,
      LayoutGrid, SlidersHorizontal, X, Mic, ZoomIn, ZoomOut, AudioWaveform
    } = LucideReact;

    /* 햅틱 피드백 헬퍼 */
    const haptic = (ms = 10) => { try { navigator.vibrate?.(ms); } catch(_) {} };

    // ==========================================
    // 공통 상수 및 헬퍼
    // ==========================================
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    const CHROMATIC_NOTES = [
      ['C','B#'],['C#','Db'],['D'],['D#','Eb'],['E','Fb'],['F','E#'],
      ['F#','Gb'],['G'],['G#','Ab'],['A'],['A#','Bb'],['B','Cb']
    ];

    const VIOLIN_STRINGS = [
      { name:'G3', id:4, note:'G', octave:3, semitone:-14 },
      { name:'D4', id:3, note:'D', octave:4, semitone:-7  },
      { name:'A4', id:2, note:'A', octave:4, semitone:0   },
      { name:'E5', id:1, note:'E', octave:5, semitone:7   },
    ];

    const CENT_STEPS = [-50,-40,-30,-20,-10,0,10,20,30,40,50];

    const KEY_SIGNATURES = {
      'C Major (0)': ['C','D','E','F','G','A','B'],
      'G Major (1#)': ['G','A','B','C','D','E','F#'],
      'D Major (2#)': ['D','E','F#','G','A','B','C#'],
      'A Major (3#)': ['A','B','C#','D','E','F#','G#'],
      'E Major (4#)': ['E','F#','G#','A','B','C#','D#'],
      'B Major (5#)': ['B','C#','D#','E','F#','G#','A#'],
      'F# Major (6#)': ['F#','G#','A#','B','C#','D#','E#'],
      'C# Major (7#)': ['C#','D#','E#','F#','G#','A#','B#'],
      'F Major (1b)': ['F','G','A','Bb','C','D','E'],
      'Bb Major (2b)': ['Bb','C','D','Eb','F','G','A'],
      'Eb Major (3b)': ['Eb','F','G','Ab','Bb','C','D'],
      'Ab Major (4b)': ['Ab','Bb','C','Db','Eb','F','G'],
      'Db Major (5b)': ['Db','Eb','F','Gb','Ab','Bb','C'],
      'Gb Major (6b)': ['Gb','Ab','Bb','Cb','Db','Eb','F'],
      'Cb Major (7b)': ['Cb','Db','Eb','Fb','Gb','Ab','Bb'],
    };

    const generateFingerboardStrings = (maxPos) => {
      const stringsInfo = [
        { string:'E', name:'1번줄', baseIdx:4,  baseOct:5 },
        { string:'A', name:'2번줄', baseIdx:9,  baseOct:4 },
        { string:'D', name:'3번줄', baseIdx:2,  baseOct:4 },
        { string:'G', name:'4번줄', baseIdx:7,  baseOct:3 },
      ];
      return stringsInfo.map(info => {
        const notes = [];
        for (let pos = 0; pos <= maxPos; pos++) {
          const noteIndex = (info.baseIdx + pos) % 12;
          const octaveShift = Math.floor((info.baseIdx + pos) / 12);
          notes.push({
            pos, names: CHROMATIC_NOTES[noteIndex], noteIndex,
            octave: info.baseOct + octaveShift, id: `${info.string}${pos}`
          });
        }
        return { string: info.string, name: info.name, notes };
      });
    };

    const FINGERBOARD_STRINGS_EXT = generateFingerboardStrings(25);

    // ── 메트로놈 아이콘 SVG ──
    const NoteQuarter  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
        <circle cx="10" cy="17" r="2.8"/>
        <rect x="11.8" y="5" width="1.2" height="12"/>
      </svg>
    );
    const NoteEighths  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
        <circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/>
        <rect x="8.5" y="6" width="1.2" height="11"/><rect x="18.5" y="6" width="1.2" height="11"/>
        <rect x="8.5" y="5" width="11.2" height="2"/>
      </svg>
    );
    const NoteTriplet  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 32 24" fill="currentColor" className={className}>
        <circle cx="6" cy="17" r="2.2"/><circle cx="16" cy="17" r="2.2"/><circle cx="26" cy="17" r="2.2"/>
        <rect x="7" y="7" width="1.2" height="10"/><rect x="17" y="7" width="1.2" height="10"/><rect x="27" y="7" width="1.2" height="10"/>
        <rect x="7" y="6" width="21.2" height="1.8"/>
        <text x="17" y="4.5" fontSize="6.5" fontWeight="900" textAnchor="middle" style={{fontStyle:'italic'}}>3</text>
      </svg>
    );
    const NoteSixteenths = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 40 24" fill="currentColor" className={className}>
        <circle cx="6" cy="17" r="2"/><circle cx="15" cy="17" r="2"/><circle cx="24" cy="17" r="2"/><circle cx="33" cy="17" r="2"/>
        <rect x="7" y="6" width="1" height="11"/><rect x="16" y="6" width="1" height="11"/>
        <rect x="25" y="6" width="1" height="11"/><rect x="34" y="6" width="1" height="11"/>
        <rect x="7" y="5" width="28" height="1.5"/><rect x="7" y="8.5" width="28" height="1.5"/>
      </svg>
    );
    const renderSubdivisionIcon = (val, className) => {
      switch(val) {
        case 1: return <NoteQuarter className={className}/>;
        case 2: return <NoteEighths className={className}/>;
        case 3: return <NoteTriplet className={className}/>;
        case 4: return <NoteSixteenths className={className}/>;
        default: return null;
      }
    };

    const getDefaultBeatSounds = (num) => {
      if (num===2) return [2,1];
      if (num===3) return [2,1,1];
      if (num===4) return [2,1,1,1];
      if (num===5) return [2,1,2,1,1];
      if (num===6) return [2,1,1,3,1,1];
      if (num===7) return [2,1,1,2,1,2,1];
      if (num===8) return [2,1,1,3,1,1,3,1];
      if (num===9) return [2,1,1,3,1,1,3,1,1];
      if (num===12) return [2,1,1,3,1,1,2,1,1,3,1,1];
      const arr = Array(num).fill(1); arr[0]=2; return arr;
    };

    const getTempoMarking = (bpm) => {
      if (bpm<40)  return "Grave";
      if (bpm<60)  return "Largo";
      if (bpm<66)  return "Larghetto";
      if (bpm<76)  return "Adagio";
      if (bpm<108) return "Andante";
      if (bpm<120) return "Moderato";
      if (bpm<168) return "Allegro";
      if (bpm<200) return "Presto";
      return "Prestissimo";
    };

    // ==========================================
    // Tuner Hook
    // ==========================================
    // ==========================================
    // 튜너 감도 설정 (localStorage 저장)
    // ==========================================
    const DEFAULT_SETTINGS = {
      gateDb: -40,       // 이 레벨(dB) 미만 소리는 무시 (노이즈 게이트)
      clarity: 0.90,     // 주기성 신뢰도 0~1. 잡음은 낮고 악기 소리는 높음
      stableFrames: 3,   // 같은 음이 N프레임 연속이어야 표시
      smoothing: 6,      // 평균낼 프레임 수 (클수록 부드럽고 느림)
      holdMs: 400,       // 소리가 끊긴 뒤 표시 유지 시간
      minFreq: 180,      // 감지 최저 Hz (바이올린 G3 = 196Hz)
      maxFreq: 3500,     // 감지 최고 Hz
      mapMode: 'full',   // 피치 맵: 'full' 전체 음역 | 'focus' 현재 음 확대
    };
    const SETTINGS_KEY = 'vt.tunerSettings.v1';
    const loadSettings = () => {
      try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') }; }
      catch (_) { return { ...DEFAULT_SETTINGS }; }
    };
    const saveSettings = (v) => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(v)); } catch (_) {} };
    const rmsToDb = (r) => (r > 0 ? 20 * Math.log10(r) : -100);
    const centsBetween = (a, b) => 1200 * Math.log2(a / b);

    /* McLeod 피치 검출(NSDF). 바이올린 음역의 lag만 계산해서 가볍다.
       반환: { freq(-1=없음), clarity(0~1), rms } */
    const detectPitch = (buf, sr, minFreq, maxFreq) => {
      const N = buf.length;
      let sum = 0;
      for (let i = 0; i < N; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / N);
      if (rms < 1e-5) return { freq: -1, clarity: 0, rms };
      const minLag = Math.max(2, Math.floor(sr / maxFreq));
      const maxLag = Math.min(Math.floor(N / 2), Math.ceil(sr / minFreq));
      const nsdf = new Float32Array(maxLag + 2);
      for (let tau = 0; tau <= maxLag + 1; tau++) {
        let acf = 0, m = 0;
        for (let j = 0; j < N - tau; j++) { const a = buf[j], b = buf[j + tau]; acf += a * b; m += a * a + b * b; }
        nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
      }
      // 0 근처의 첫 양수 구간은 건너뛴다
      let tau = 1;
      while (tau < maxLag && nsdf[tau] > 0) tau++;
      if (tau < minLag) tau = minLag;
      const peaks = [];
      let best = -1, bestTau = -1;
      for (; tau <= maxLag; tau++) {
        if (nsdf[tau] > 0) {
          if (nsdf[tau] > best) { best = nsdf[tau]; bestTau = tau; }
        } else if (bestTau > 0) {
          peaks.push(bestTau); best = -1; bestTau = -1;
        }
      }
      if (bestTau > 0) peaks.push(bestTau);
      if (!peaks.length) return { freq: -1, clarity: 0, rms };
      let maxPeak = 0;
      peaks.forEach(t => { if (nsdf[t] > maxPeak) maxPeak = nsdf[t]; });
      const chosen = peaks.find(t => nsdf[t] >= 0.9 * maxPeak);
      // 포물선 보간
      const y1 = nsdf[chosen - 1], y2 = nsdf[chosen], y3 = nsdf[chosen + 1];
      const a = (y1 + y3 - 2 * y2) / 2, b = (y3 - y1) / 2;
      let T0 = chosen, clarity = y2;
      if (a < 0) { T0 = chosen - b / (2 * a); clarity = y2 - (b * b) / (4 * a); }
      return { freq: sr / T0, clarity: Math.min(1, clarity), rms };
    };

    const useTunerLogic = () => {
      const [isStarted, setIsStarted] = useState(false);
      const [pitch, setPitch] = useState(0);
      const [cents, setCents] = useState(0);
      const [stringCents, setStringCents] = useState(0);
      const [a4Freq, setA4Freq] = useState(442);
      const [tolerance, setTolerance] = useState(10);
      const [currentNote, setCurrentNote] = useState({ name:'A', octave:4, symbol:'' });
      const [closestString, setClosestString] = useState(VIOLIN_STRINGS[2]);
      const [error, setError] = useState(null);
      const [playingTone, setPlayingTone] = useState(null);

      const audioContextRef = useRef(null);
      const analyserRef    = useRef(null);
      const animationRef   = useRef(null);
      const bufferRef      = useRef(null);
      const oscillatorRef  = useRef(null);
      const gainNodeRef    = useRef(null);
      const freqHistoryRef = useRef([]);
      const a4FreqRef      = useRef(442);
      const streamRef      = useRef(null);
      const settingsRef    = useRef(loadSettings());
      const [settings, setSettingsState] = useState(settingsRef.current);
      const levelRef       = useRef({ db: -100, clarity: 0, freq: -1, gate: false, accepted: false });
      const historyRef     = useRef([]);   // 피치 맵용 [{t, freq|null, cents}]
      const gateOpenRef    = useRef(false);
      const candidateRef   = useRef({ freq: 0, count: 0 });
      const lastGoodRef    = useRef(0);
      const calibRef       = useRef(null);
      const startingRef    = useRef(null);

      const updateSettings = (patch) => {
        const next = { ...settingsRef.current, ...patch };
        settingsRef.current = next;
        saveSettings(next);
        setSettingsState(next);
      };
      const resetSettings = () => updateSettings({ ...DEFAULT_SETTINGS, mapMode: settingsRef.current.mapMode });

      useEffect(() => {
        ensureMic();
        const onVisibility = () => {
          if (document.visibilityState === 'hidden') stopTuner();
          else ensureMic();
        };
        const resumeAudio = () => {
          if (audioContextRef.current?.state === 'suspended') audioContextRef.current.resume();
        };
        document.addEventListener('visibilitychange', onVisibility);
        document.addEventListener('pointerdown', resumeAudio);
        return () => {
          document.removeEventListener('visibilitychange', onVisibility);
          document.removeEventListener('pointerdown', resumeAudio);
          stopTuner(); stopTone();
        };
      }, []);

      const initAudioContext = async () => {
        if (!audioContextRef.current) {
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
          gainNodeRef.current = audioContextRef.current.createGain();
          gainNodeRef.current.connect(audioContextRef.current.destination);
        }
        if (audioContextRef.current.state === 'suspended') {
          await audioContextRef.current.resume();
        }
      };

      const toggleTone = async (id, semitonesFromA4) => {
        await initAudioContext();
        if (playingTone === id) { stopTone(); return; }
        stopTone();
        haptic(15);
        const targetFreq = a4FreqRef.current * Math.pow(2, semitonesFromA4 / 12);
        const osc = audioContextRef.current.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(targetFreq, audioContextRef.current.currentTime);
        const filter = audioContextRef.current.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2500;
        osc.connect(filter);
        filter.connect(gainNodeRef.current);
        gainNodeRef.current.gain.setValueAtTime(0, audioContextRef.current.currentTime);
        gainNodeRef.current.gain.linearRampToValueAtTime(0.6, audioContextRef.current.currentTime + 0.1);
        osc.start();
        oscillatorRef.current = osc;
        setPlayingTone(id);
      };

      const stopTone = () => {
        if (oscillatorRef.current) {
          const now = audioContextRef.current.currentTime;
          gainNodeRef.current?.gain.linearRampToValueAtTime(0, now + 0.1);
          oscillatorRef.current.stop(now + 0.2);
          oscillatorRef.current = null;
        }
        setPlayingTone(null);
      };

      const update = useCallback(() => {
        if (!analyserRef.current) return;
        const S = settingsRef.current;
        const now = performance.now();
        analyserRef.current.getFloatTimeDomainData(bufferRef.current);
        const { freq: raw, clarity, rms } = detectPitch(bufferRef.current, audioContextRef.current.sampleRate, S.minFreq, S.maxFreq);
        const db = rmsToDb(rms);
        if (calibRef.current) calibRef.current.push(db);

        // 노이즈 게이트 (3dB 히스테리시스: 열릴 땐 임계값, 닫힐 땐 -3dB)
        gateOpenRef.current = gateOpenRef.current ? db > S.gateDb - 3 : db > S.gateDb;

        let accepted = false;
        if (gateOpenRef.current && raw > 0 && clarity >= S.clarity) {
          const c = candidateRef.current;
          if (c.freq && Math.abs(centsBetween(raw, c.freq)) < 50) c.count++;
          else c.count = 1;
          c.freq = raw;

          if (c.count >= S.stableFrames) {
            accepted = true;
            const hist = freqHistoryRef.current;
            const last = hist[hist.length - 1];
            if (last && Math.abs(centsBetween(raw, last)) > 50) hist.length = 0;
            hist.push(raw);
            while (hist.length > S.smoothing) hist.shift();
            const freq = hist.reduce((a, b) => a + b, 0) / hist.length;
            lastGoodRef.current = now;

            const currentA4 = a4FreqRef.current;
            const semitonesFromA4Exact = 12 * Math.log2(freq / currentA4);
            const noteNum = Math.round(semitonesFromA4Exact) + 69;
            const chromaticTargetFreq = currentA4 * Math.pow(2, Math.round(semitonesFromA4Exact) / 12);
            const chromaticCentsOff = Math.round(centsBetween(freq, chromaticTargetFreq));
            let minDiff = Infinity, closestStr = VIOLIN_STRINGS[2];
            VIOLIN_STRINGS.forEach(st => {
              const diff = Math.abs(semitonesFromA4Exact - st.semitone);
              if (diff < minDiff) { minDiff = diff; closestStr = st; }
            });
            const stringTargetFreq = currentA4 * Math.pow(2, closestStr.semitone / 12);
            const strCentsOff = Math.round(centsBetween(freq, stringTargetFreq));
            const noteIndex = (noteNum % 12 + 12) % 12;
            const octave = Math.floor(noteNum / 12) - 1;
            const fullNote = NOTE_NAMES[noteIndex];
            historyRef.current.push({ t: now, freq, cents: chromaticCentsOff });
            setPitch(freq.toFixed(1));
            setCents(chromaticCentsOff);
            setStringCents(strCentsOff);
            setClosestString(closestStr);
            setCurrentNote({
              name: fullNote.replace('#', ''),
              symbol: fullNote.includes('#') ? '#' : '',
              octave
            });
          }
        } else {
          candidateRef.current.count = 0;
        }

        if (!accepted) {
          historyRef.current.push({ t: now, freq: null });
          if (lastGoodRef.current && now - lastGoodRef.current > S.holdMs) {
            lastGoodRef.current = 0;
            freqHistoryRef.current = [];
            setPitch(0); setCents(0); setStringCents(0);
          }
        }
        const h = historyRef.current;
        while (h.length && now - h[0].t > 6000) h.shift();
        levelRef.current = { db, clarity, freq: raw, gate: gateOpenRef.current, accepted };
        animationRef.current = requestAnimationFrame(update);
      }, []);

      // 마이크 켜기 (이미 켜져 있으면 그대로)
      const ensureMic = async () => {
        if (streamRef.current) return true;
        if (startingRef.current) return startingRef.current;
        setError(null);
        startingRef.current = (async () => { try {
          await initAudioContext();
          if (!navigator.mediaDevices?.getUserMedia)
            throw new Error("브라우저에서 마이크 기능을 지원하지 않습니다.");
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation:false, autoGainControl:false, noiseSuppression:false }
          });
          streamRef.current = stream;
          if (audioContextRef.current.state==='suspended') await audioContextRef.current.resume();
          analyserRef.current = audioContextRef.current.createAnalyser();
          analyserRef.current.fftSize = 2048;
          bufferRef.current = new Float32Array(analyserRef.current.fftSize);
          audioContextRef.current.createMediaStreamSource(stream).connect(analyserRef.current);
          setIsStarted(true);
          update();
          return true;
        } catch (err) {
          if (err.name==='NotAllowedError'||err.name==='NotFoundError'||err.message.includes('Permission dismissed')) {
            setError("마이크 권한이 거부되었습니다.\n브라우저 설정에서 마이크를 허용해주세요.");
          } else {
            setError("마이크를 사용할 수 없습니다: "+err.message);
          }
          setIsStarted(false);
          return false;
        } finally { startingRef.current = null; } })();
        return startingRef.current;
      };

      const startTuner = async () => {
        if (streamRef.current) { stopTuner(); return; }
        haptic(20);
        await ensureMic();
      };

      // 주변 소음 측정 → 소음 상위 5% 레벨 + 8dB 를 게이트로 설정
      const calibrateNoise = async (ms = 3000) => {
        if (!(await ensureMic())) return null;
        calibRef.current = [];
        await new Promise(r => setTimeout(r, ms));
        const samples = (calibRef.current || []).sort((a, b) => a - b);
        calibRef.current = null;
        if (!samples.length) return null;
        const noise = samples[Math.floor(samples.length * 0.95)];
        const gate = Math.round(Math.min(-10, Math.max(-80, noise + 8)));
        updateSettings({ gateDb: gate });
        haptic(20);
        return { noise: Math.round(noise), gate };
      };

      const stopTuner = () => {
        if (animationRef.current) { cancelAnimationFrame(animationRef.current); animationRef.current=null; }
        streamRef.current?.getTracks().forEach(t=>t.stop());
        streamRef.current=null;
        analyserRef.current=null;
        historyRef.current=[]; freqHistoryRef.current=[];
        gateOpenRef.current=false; candidateRef.current={ freq:0, count:0 }; lastGoodRef.current=0;
        levelRef.current={ db:-100, clarity:0, freq:-1, gate:false, accepted:false };
        setIsStarted(false); setPitch(0); setCents(0); setStringCents(0);
      };

      const handleReset = () => {
        stopTone();
        setA4Freq(442); a4FreqRef.current=442;
        setTolerance(10); setClosestString(VIOLIN_STRINGS[2]); setError(null);
        haptic(10);
      };

      const cycleA4Freq = () => {
        setA4Freq(prev => {
          const next = prev >= 443 ? 440 : prev+1;
          a4FreqRef.current=next;
          if (playingTone && oscillatorRef.current && audioContextRef.current) {
            let semitonesFromA4=0;
            const stringObj = VIOLIN_STRINGS.find(s=>s.name===playingTone);
            if (stringObj) {
              semitonesFromA4=stringObj.semitone;
            } else {
              const playingStrName=playingTone.replace(/[0-9]+$/,'');
              const pos=parseInt(playingTone.replace(/[^0-9]/g,''),10);
              const baseInfo=[
                {string:'E',baseIdx:4,baseOct:5},{string:'A',baseIdx:9,baseOct:4},
                {string:'D',baseIdx:2,baseOct:4},{string:'G',baseIdx:7,baseOct:3}
              ].find(i=>i.string===playingStrName);
              if (baseInfo) {
                const ni=(baseInfo.baseIdx+pos)%12;
                const os=Math.floor((baseInfo.baseIdx+pos)/12);
                semitonesFromA4=(baseInfo.baseOct+os)*12+ni-57;
              }
            }
            oscillatorRef.current.frequency.setValueAtTime(
              next*Math.pow(2,semitonesFromA4/12), audioContextRef.current.currentTime
            );
          }
          return next;
        });
        haptic(8);
      };

      const cycleTolerance = () => { setTolerance(prev=>prev>=24?4:prev+2); haptic(8); };

      return {
        isStarted, pitch, cents, stringCents, a4Freq, tolerance,
        currentNote, closestString, error, playingTone,
        startTuner, stopTuner, toggleTone, handleReset, cycleA4Freq, cycleTolerance,
        settings, updateSettings, resetSettings, levelRef, historyRef, ensureMic, calibrateNoise
      };
    };

    // ==========================================
    // 1. Tuner Component
    // ==========================================
    // ==========================================
    // 피치 맵: 세로축 = 음높이(위로 갈수록 높은 음), 가로축 = 시간(최근 5초)
    // ==========================================
    const MAP_WINDOW_MS = 5000;
    const FULL_RANGE = { lo: -16, hi: 26 };   // A4 기준 반음: F#3 ~ B6
    const FOCUS_SPAN = 7;                      // 집중 모드: 현재 음 ±7반음
    const OPEN_STRING_COLORS = { G:'#f97316', D:'#eab308', A:'#4afc9d', E:'#38bdf8' };

    const PitchMap = ({ tuner }) => {
      const { historyRef, a4Freq, tolerance, isStarted, settings, updateSettings, closestString } = tuner;
      const canvasRef = useRef(null);
      const wrapRef = useRef(null);
      const propsRef = useRef({});
      const centerRef = useRef(0);
      propsRef.current = { a4Freq, tolerance, isStarted, mode: settings.mapMode, closest: closestString?.name };

      useEffect(() => {
        const canvas = canvasRef.current, wrap = wrapRef.current;
        const ctx = canvas.getContext('2d');
        let raf, W = 0, H = 0;
        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          W = wrap.clientWidth; H = wrap.clientHeight;
          canvas.width = W * dpr; canvas.height = H * dpr;
          canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        const ro = new ResizeObserver(resize); ro.observe(wrap);

        const LEFT = 30, PAD_T = 10, PAD_B = 10;
        const draw = () => {
          const { a4Freq, tolerance, isStarted, mode, closest } = propsRef.current;
          const now = performance.now();
          const hist = historyRef.current;
          let lastFreq = null;
          for (let i = hist.length - 1; i >= 0 && now - hist[i].t < 1500; i--) if (hist[i].freq) { lastFreq = hist[i].freq; break; }
          const curSemi = lastFreq ? 12 * Math.log2(lastFreq / a4Freq) : null;

          let lo, hi;
          if (mode === 'focus') {
            if (curSemi !== null) centerRef.current += (curSemi - centerRef.current) * 0.08;
            lo = centerRef.current - FOCUS_SPAN; hi = centerRef.current + FOCUS_SPAN;
          } else { lo = FULL_RANGE.lo; hi = FULL_RANGE.hi; }
          const plotH = H - PAD_T - PAD_B;
          const y = (semi) => PAD_T + plotH - ((semi - lo) / (hi - lo)) * plotH;
          const x = (t) => LEFT + (W - LEFT - 14) * (1 - (now - t) / MAP_WINDOW_MS);

          ctx.clearRect(0, 0, W, H);
          // 반음 격자
          ctx.font = '700 9px ui-monospace, monospace';
          ctx.textBaseline = 'middle';
          for (let st = Math.ceil(lo); st <= Math.floor(hi); st++) {
            const yy = y(st);
            const idx = ((st + 9) % 12 + 12) % 12;          // 0 = C
            const name = NOTE_NAMES[idx];
            const oct = Math.floor((st + 57) / 12);
            const isC = idx === 0;
            ctx.strokeStyle = isC ? '#262626' : (name.includes('#') ? '#0d0d0d' : '#161616');
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(LEFT, yy); ctx.lineTo(W, yy); ctx.stroke();
            const nearOpen = VIOLIN_STRINGS.some(v => Math.abs(v.semitone - st) <= (mode === 'focus' ? 0 : 2));
            if (!nearOpen && (mode === 'focus' ? !name.includes('#') : isC)) {
              ctx.fillStyle = '#4b5563';
              ctx.textAlign = 'right';
              ctx.fillText(name + oct, LEFT - 5, yy);
            }
          }
          // 개방현 가이드
          VIOLIN_STRINGS.forEach(s => {
            if (s.semitone < lo || s.semitone > hi) return;
            const yy = y(s.semitone), col = OPEN_STRING_COLORS[s.note];
            const active = isStarted && closest === s.name && lastFreq;
            ctx.strokeStyle = col; ctx.globalAlpha = active ? 0.9 : 0.35;
            ctx.setLineDash([4, 4]); ctx.lineWidth = active ? 1.5 : 1;
            ctx.beginPath(); ctx.moveTo(LEFT, yy); ctx.lineTo(W, yy); ctx.stroke();
            ctx.setLineDash([]); ctx.globalAlpha = 1;
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(2, yy - 7, 24, 14, 7); ctx.fill();
            ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.font = '900 9px ui-sans-serif, system-ui';
            ctx.fillText(s.note + s.octave, 14, yy + 0.5);
            ctx.font = '700 9px ui-monospace, monospace';
          });
          // 현재 음 허용범위(±tolerance cents) 밴드
          if (curSemi !== null) {
            const target = Math.round(curSemi);
            const y1 = y(target + tolerance / 100), y2 = y(target - tolerance / 100);
            ctx.fillStyle = 'rgba(74,252,157,0.10)';
            ctx.fillRect(LEFT, y1, W - LEFT, Math.max(1, y2 - y1));
          }
          // 음정 궤적
          let prev = null;
          for (let i = 0; i < hist.length; i++) {
            const pt = hist[i];
            if (!pt.freq) { prev = null; continue; }
            const semi = 12 * Math.log2(pt.freq / a4Freq);
            if (semi < lo - 1 || semi > hi + 1) { prev = null; continue; }
            const ac = Math.abs(pt.cents);
            const col = ac <= tolerance ? '#4afc9d' : ac <= tolerance + 15 ? '#ffcc00' : '#ff4d4d';
            const px = x(pt.t), py = y(semi);
            const age = (now - pt.t) / MAP_WINDOW_MS;
            ctx.globalAlpha = Math.max(0.15, 1 - age * 0.85);
            if (prev && pt.t - prev.t < 120) {
              ctx.strokeStyle = col; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(px, py); ctx.stroke();
            } else {
              ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI * 2); ctx.fill();
            }
            prev = { x: px, y: py, t: pt.t };
          }
          ctx.globalAlpha = 1;
          // 현재 위치 마커
          const lastPt = hist[hist.length - 1];
          if (lastPt && lastPt.freq && now - lastPt.t < 200) {
            const semi = 12 * Math.log2(lastPt.freq / a4Freq);
            const ac = Math.abs(lastPt.cents);
            const col = ac <= tolerance ? '#4afc9d' : ac <= tolerance + 15 ? '#ffcc00' : '#ff4d4d';
            const py = Math.min(H - 4, Math.max(4, y(semi))), px = W - 14;
            ctx.shadowColor = col; ctx.shadowBlur = 14;
            ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          }
          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(raf); ro.disconnect(); };
      }, []);

      const focus = settings.mapMode === 'focus';
      return (
        <div className="relative w-full max-w-sm h-[26vh] min-h-[150px] max-h-[240px] shrink-0 mt-2 rounded-3xl bg-[#060606] border border-white/5 shadow-[inset_0_2px_20px_rgba(0,0,0,1)] overflow-hidden">
          <div ref={wrapRef} className="absolute inset-0"><canvas ref={canvasRef}/></div>
          <div className="absolute top-2 left-9 flex items-center gap-1 pointer-events-none">
            <span className="text-[8px] font-black tracking-[0.25em] text-gray-600">PITCH MAP</span>
            <span className="text-[8px] font-black text-gray-700">· 높음 ▲ / 낮음 ▼</span>
          </div>
          <button onClick={() => { updateSettings({ mapMode: focus ? 'full' : 'focus' }); haptic(8); }}
            className="absolute top-2 right-2 flex items-center gap-1 bg-black/70 border border-gray-800 rounded-full px-2 py-1 text-[9px] font-black text-gray-400 active:scale-95">
            {focus ? <ZoomOut size={11}/> : <ZoomIn size={11}/>}
            {focus ? '전체' : '집중'}
          </button>
          {!isStarted && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <span className="text-[10px] font-bold text-gray-700 bg-black/60 px-3 py-1 rounded-full">마이크 연결 중… (권한을 허용해주세요)</span>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 감도 설정 시트
    // ==========================================
    const SliderRow = ({ label, value, display, min, max, step, onChange, hint }) => (
      <div className="flex flex-col gap-1.5">
        <div className="flex justify-between items-baseline">
          <span className="text-xs font-bold text-gray-300">{label}</span>
          <span className="text-sm font-mono font-black text-white">{display ?? value}</span>
        </div>
        <input type="range" min={min} max={max} step={step} value={value}
          onChange={e => onChange(Number(e.target.value))} className="w-full"/>
        {hint && <span className="text-[10px] text-gray-600 leading-snug">{hint}</span>}
      </div>
    );

    const LevelMeter = ({ value, min, max, marker, active, format }) => {
      const pct = (v) => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
      return (
        <div className="relative h-3 w-full bg-[#141414] rounded-full overflow-hidden border border-white/5">
          <div className="absolute inset-y-0 left-0 rounded-full transition-[width] duration-75"
            style={{ width: pct(value) + '%', background: active ? '#4afc9d' : '#4b5563', boxShadow: active ? '0 0 10px #4afc9d' : 'none' }}/>
          <div className="absolute inset-y-[-2px] w-[2px] bg-white" style={{ left: `calc(${pct(marker)}% - 1px)` }}/>
        </div>
      );
    };

    const Section = ({ title, children }) => (
      <div className="flex flex-col gap-4 bg-[#0f0f0f] border border-white/5 rounded-2xl p-4">
        <span className="text-[10px] font-black tracking-[0.2em] text-gray-500 uppercase">{title}</span>
        {children}
      </div>
    );

    const SettingsSheet = ({ tuner, onClose }) => {
      const { settings: S, updateSettings, resetSettings, levelRef, isStarted, ensureMic, calibrateNoise } = tuner;
      const [lv, setLv] = useState(levelRef.current);
      const [calib, setCalib] = useState(null);   // null | {running, left} | {noise, gate}

      useEffect(() => {
        let raf, last = 0;
        const tick = (t) => {
          if (t - last > 50) { setLv({ ...levelRef.current }); last = t; }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, []);

      const runCalib = async () => {
        const total = 3000, started = Date.now();
        setCalib({ running: true, left: 3 });
        const iv = setInterval(() => setCalib({ running: true, left: Math.max(0, Math.ceil((total - (Date.now() - started)) / 1000)) }), 200);
        const res = await calibrateNoise(total);
        clearInterval(iv);
        setCalib(res || null);
      };

      const db = Math.max(-80, lv.db);
      return (
        <div className="absolute inset-0 z-50 flex flex-col justify-end bg-black/70 backdrop-blur-sm" onClick={onClose}>
          <div className="w-full max-h-[92%] overflow-y-auto bg-[#080808] border-t border-gray-800 rounded-t-[2rem] px-4 pt-3 pb-6 flex flex-col gap-3 shadow-[0_-20px_60px_rgba(0,0,0,0.9)]"
            onClick={e => e.stopPropagation()}>
            <div className="w-10 h-1 bg-gray-700 rounded-full self-center mb-1"/>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <SlidersHorizontal size={16} className="text-[#4afc9d]"/>
                <span className="text-base font-black">튜너 감도 설정</span>
              </div>
              <button onClick={onClose} className="p-2 rounded-full bg-[#1a1a1a] border border-gray-800 text-gray-400"><X size={14}/></button>
            </div>

            <Section title="① 입력 테스트 · 노이즈 게이트">
              {!isStarted ? (
                <button onClick={ensureMic}
                  className="flex items-center justify-center gap-2 py-3 rounded-full bg-[#4afc9d]/10 border border-[#4afc9d]/30 text-[#4afc9d] text-sm font-bold">
                  <Mic size={15}/> 마이크 켜고 테스트
                </button>
              ) : (
                <>
                  <div className="flex flex-col gap-1.5">
                    <div className="flex justify-between text-[10px] font-bold">
                      <span className="text-gray-500">입력 레벨</span>
                      <span className="font-mono text-gray-300">{db.toFixed(0)} dB</span>
                    </div>
                    <LevelMeter value={db} min={-80} max={0} marker={S.gateDb} active={lv.gate}/>
                    <div className="flex gap-1.5 mt-1 flex-wrap">
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${lv.gate ? 'bg-[#4afc9d]/15 text-[#4afc9d]' : 'bg-gray-800 text-gray-500'}`}>
                        게이트 {lv.gate ? '열림' : '닫힘'}
                      </span>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${lv.accepted ? 'bg-[#4afc9d]/15 text-[#4afc9d]' : 'bg-gray-800 text-gray-500'}`}>
                        {lv.accepted ? `감지 ✓ ${lv.freq.toFixed(1)}Hz` : '감지 안 함'}
                      </span>
                    </div>
                  </div>
                  <button onClick={runCalib} disabled={calib?.running}
                    className="flex items-center justify-center gap-2 py-3 rounded-full bg-[#1a1a1a] border border-gray-700 text-white text-sm font-bold active:scale-95 disabled:opacity-60">
                    <AudioWaveform size={15} className="text-[#4afc9d]"/>
                    {calib?.running ? `조용히 해주세요… ${calib.left}초` : '주변 소음 자동 측정 (3초)'}
                  </button>
                  {calib && !calib.running && (
                    <span className="text-[11px] text-[#4afc9d] text-center font-bold">
                      소음 {calib.noise} dB → 임계값 {calib.gate} dB 로 설정됨
                    </span>
                  )}
                </>
              )}
              <SliderRow label="소음 차단 임계값" value={S.gateDb} display={`${S.gateDb} dB`} min={-80} max={-10} step={1}
                onChange={v => updateSettings({ gateDb: v })}
                hint="흰 선보다 큰 소리만 분석합니다. 잡음에 반응하면 오른쪽으로, 약한 소리를 못 잡으면 왼쪽으로."/>
            </Section>

            <Section title="② 음정 신뢰도">
              {isStarted && (
                <div className="flex flex-col gap-1.5">
                  <div className="flex justify-between text-[10px] font-bold">
                    <span className="text-gray-500">현재 신뢰도</span>
                    <span className="font-mono text-gray-300">{lv.clarity.toFixed(2)}</span>
                  </div>
                  <LevelMeter value={lv.clarity} min={0.5} max={1} marker={S.clarity} active={lv.clarity >= S.clarity && lv.gate}/>
                </div>
              )}
              <SliderRow label="최소 신뢰도" value={S.clarity} display={S.clarity.toFixed(2)} min={0.7} max={0.98} step={0.01}
                onChange={v => updateSettings({ clarity: v })}
                hint="소리가 얼마나 '음정다운지'. 잡음·말소리는 낮고 현 소리는 0.9 이상. 높일수록 잡음에 강해집니다."/>
            </Section>

            <Section title="③ 안정화">
              <SliderRow label="확정 프레임" value={S.stableFrames} display={`${S.stableFrames}프레임 · ${Math.round(S.stableFrames * 16.7)}ms`} min={1} max={10} step={1}
                onChange={v => updateSettings({ stableFrames: v })}
                hint="같은 음이 이만큼 연속돼야 표시. 순간 잡음으로 튀는 걸 막습니다."/>
              <SliderRow label="평균 프레임" value={S.smoothing} display={`${S.smoothing}`} min={1} max={15} step={1}
                onChange={v => updateSettings({ smoothing: v })}
                hint="클수록 바늘이 부드럽게, 작을수록 빠르게 움직입니다."/>
              <SliderRow label="표시 유지 시간" value={S.holdMs} display={`${S.holdMs}ms`} min={0} max={1500} step={50}
                onChange={v => updateSettings({ holdMs: v })}

            <Section title="④ 감지 범위">
              <SliderRow label="최저 주파수" value={S.minFreq} display={`${S.minFreq} Hz`} min={60} max={300} step={5}
                onChange={v => updateSettings({ minFreq: v })}
                hint="바이올린 최저음 G3 = 196Hz. 180Hz면 저음 웅웅거림을 걸러냅니다."/>
              <SliderRow label="최고 주파수" value={S.maxFreq} display={`${S.maxFreq} Hz`} min={1000} max={5000} step={100}
                onChange={v => updateSettings({ maxFreq: v })}/>

            <div className="flex gap-3 mt-1">
              <button onClick={() => { resetSettings(); setCalib(null); haptic(10); }}

              <button onClick={onClose}
