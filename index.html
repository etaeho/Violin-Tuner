<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA / Mobile App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Violin Tuner" />
  <meta name="application-name" content="Violin Tuner" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="바이올린 튜너 · 메트로놈 · 지판" />
  <meta name="msapplication-TileColor" content="#000000" />

  <title>Violin Tuner</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="src/theme.css" />

  <script>
    // 시작 중 에러가 나면 로딩화면에 표시 (무한 로딩 대신 원인 확인용)
    window.addEventListener('error', (e) => {
      const sp = document.getElementById('splash');
      if (!sp || document.getElementById('splash-error')) return;
      const box = document.createElement('pre');
      box.id = 'splash-error';
      box.style.cssText = 'color:#f87171;font-size:12px;white-space:pre-wrap;padding:16px;max-width:90vw;margin-top:16px';
      box.textContent = '⚠️ 로딩 오류\n' + (e.message || e) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
      sp.appendChild(box);
    });
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- Lucide React UMD -->
  <script>window.react = window.React; // lucide UMD는 소문자 react 전역을 찾음</script>
  <script src="vendor/lucide-react.min.js"></script>

  <!-- Babel Standalone (JSX in browser) -->
  <script src="vendor/babel.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    #root { height: 100%; }

    /* Prevent iOS double-tap zoom on interactive elements */
    button, a, input, select, label {
      touch-action: manipulation;
    }

    /* Range input styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #1f2937;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4afc9d;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(74,252,157,0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4afc9d;
      cursor: pointer;
      border: none;
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* Splash / Loading screen */
    #splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #1a1a1a;
      border-top-color: #4afc9d;
      animation: spin 1s linear infinite;
    }
    .splash-icon {
      position: absolute;
      font-size: 34px;
      line-height: 1;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .dot-wave {
      display: flex;
      gap: 6px;
      margin-top: 24px;
    }
    .dot-wave span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4afc9d;
      animation: wave 1.2s infinite ease-in-out;
    }
    .dot-wave span:nth-child(2) { animation-delay: 0.15s; }
    .dot-wave span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Tab transition */
    .tab-enter {
      animation: tabIn 0.2s ease-out forwards;
    }
    @keyframes tabIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;">
      <div class="splash-ring"></div>
      <span class="splash-icon">🎻</span>
    </div>
    <div class="dot-wave">
      <span></span><span></span><span></span>
    </div>
    <p style="color:#333;font-size:10px;margin-top:18px;font-family:sans-serif;letter-spacing:3px;text-transform:uppercase;">Violin Tuner</p>
  </div>

  <div id="root"></div>

  <!-- 앱 코드 (src/ 모듈, 순서 중요) -->
  <script type="text/babel" src="src/core.jsx"></script>
  <script type="text/babel" src="src/commands.jsx"></script>
  <script type="text/babel" src="src/theme.jsx"></script>
  <script type="text/babel" src="src/tuner.jsx"></script>
  <script type="text/babel" src="src/metronome.jsx"></script>
  <script type="text/babel" src="src/fingerboard.jsx"></script>
  <script type="text/babel" src="src/drone.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <script>
    // Register service worker for offline / installable PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
