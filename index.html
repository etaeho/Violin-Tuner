<html lang="ko">
<head>

  <script>
    // 시작 중 에러가 나면 로딩화면에 표시 (무한 로딩 대신 원인 확인용)
    window.addEventListener('error', (e) => {
      const sp = document.getElementById('splash');
      if (!sp || document.getElementById('splash-error')) return;
      const box = document.createElement('pre');
      box.id = 'splash-error';
      box.style.cssText = 'color:#f87171;font-size:12px;white-space:pre-wrap;padding:16px;max-width:90vw;margin-top:16px';
      box.textContent = '⚠️ 로딩 오류\n' + (e.message || e) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
      sp.appendChild(box);
    });

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);

  <script type="text/babel">
    /* =====================================================
       모든 React hooks 및 Lucide 아이콘을 전역에서 가져옴
    ===================================================== */
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      Play, Square, Settings, Volume2, VolumeX, AlertCircle,
      Music, Activity, Minus, Plus, ChevronUp, ChevronDown, RotateCcw,
      LayoutGrid, SlidersHorizontal, X, Mic, ZoomIn, ZoomOut, AudioWaveform
    } = LucideReact;

    /* 햅틱 피드백 헬퍼 */
    const haptic = (ms = 10) => { try { navigator.vibrate?.(ms); } catch(_) {} };

    // ==========================================
    // 공통 상수 및 헬퍼
    // ==========================================
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    const CHROMATIC_NOTES = [
      ['C','B#'],['C#','Db'],['D'],['D#','Eb'],['E','Fb'],['F','E#'],
      ['F#','Gb'],['G'],['G#','Ab'],['A'],['A#','Bb'],['B','Cb']
    ];

    const VIOLIN_STRINGS = [
      { name:'G3', id:4, note:'G', octave:3, semitone:-14 },
      { name:'D4', id:3, note:'D', octave:4, semitone:-7  },
      { name:'A4', id:2, note:'A', octave:4, semitone:0   },
      { name:'E5', id:1, note:'E', octave:5, semitone:7   },
    ];

    const CENT_STEPS = [-50,-40,-30,-20,-10,0,10,20,30,40,50];

    const KEY_SIGNATURES = {
      'C Major (0)': ['C','D','E','F','G','A','B'],
      'G Major (1#)': ['G','A','B','C','D','E','F#'],
      'D Major (2#)': ['D','E','F#','G','A','B','C#'],
      'A Major (3#)': ['A','B','C#','D','E','F#','G#'],
      'E Major (4#)': ['E','F#','G#','A','B','C#','D#'],
      'B Major (5#)': ['B','C#','D#','E','F#','G#','A#'],
      'F# Major (6#)': ['F#','G#','A#','B','C#','D#','E#'],
      'C# Major (7#)': ['C#','D#','E#','F#','G#','A#','B#'],
      'F Major (1b)': ['F','G','A','Bb','C','D','E'],
      'Bb Major (2b)': ['Bb','C','D','Eb','F','G','A'],
      'Eb Major (3b)': ['Eb','F','G','Ab','Bb','C','D'],
      'Ab Major (4b)': ['Ab','Bb','C','Db','Eb','F','G'],
      'Db Major (5b)': ['Db','Eb','F','Gb','Ab','Bb','C'],
      'Gb Major (6b)': ['Gb','Ab','Bb','Cb','Db','Eb','F'],
      'Cb Major (7b)': ['Cb','Db','Eb','Fb','Gb','Ab','Bb'],
    };

    const generateFingerboardStrings = (maxPos) => {
      const stringsInfo = [
        { string:'E', name:'1번줄', baseIdx:4,  baseOct:5 },
        { string:'A', name:'2번줄', baseIdx:9,  baseOct:4 },
        { string:'D', name:'3번줄', baseIdx:2,  baseOct:4 },
        { string:'G', name:'4번줄', baseIdx:7,  baseOct:3 },
      ];
      return stringsInfo.map(info => {
        const notes = [];
        for (let pos = 0; pos <= maxPos; pos++) {
          const noteIndex = (info.baseIdx + pos) % 12;
          const octaveShift = Math.floor((info.baseIdx + pos) / 12);
          notes.push({
            pos, names: CHROMATIC_NOTES[noteIndex], noteIndex,
            octave: info.baseOct + octaveShift, id: `${info.string}${pos}`
          });
        }
        return { string: info.string, name: info.name, notes };
      });
    };

    const FINGERBOARD_STRINGS_EXT = generateFingerboardStrings(25);

    // ── 메트로놈 아이콘 SVG ──
    const NoteQuarter  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
        <circle cx="10" cy="17" r="2.8"/>
        <rect x="11.8" y="5" width="1.2" height="12"/>
      </svg>
    );
    const NoteEighths  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
        <circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/>
        <rect x="8.5" y="6" width="1.2" height="11"/><rect x="18.5" y="6" width="1.2" height="11"/>
        <rect x="8.5" y="5" width="11.2" height="2"/>
      </svg>
    );
    const NoteTriplet  = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 32 24" fill="currentColor" className={className}>
        <circle cx="6" cy="17" r="2.2"/><circle cx="16" cy="17" r="2.2"/><circle cx="26" cy="17" r="2.2"/>
        <rect x="7" y="7" width="1.2" height="10"/><rect x="17" y="7" width="1.2" height="10"/><rect x="27" y="7" width="1.2" height="10"/>
        <rect x="7" y="6" width="21.2" height="1.8"/>
        <text x="17" y="4.5" fontSize="6.5" fontWeight="900" textAnchor="middle" style={{fontStyle:'italic'}}>3</text>
      </svg>
    );
    const NoteSixteenths = ({ className="h-6 w-auto" }) => (
      <svg viewBox="0 0 40 24" fill="currentColor" className={className}>
        <circle cx="6" cy="17" r="2"/><circle cx="15" cy="17" r="2"/><circle cx="24" cy="17" r="2"/><circle cx="33" cy="17" r="2"/>
        <rect x="7" y="6" width="1" height="11"/><rect x="16" y="6" width="1" height="11"/>
        <rect x="25" y="6" width="1" height="11"/><rect x="34" y="6" width="1" height="11"/>
        <rect x="7" y="5" width="28" height="1.5"/><rect x="7" y="8.5" width="28" height="1.5"/>
      </svg>
    );
    const renderSubdivisionIcon = (val, className) => {
      switch(val) {
        case 1: return <NoteQuarter className={className}/>;
        case 2: return <NoteEighths className={className}/>;
        case 3: return <NoteTriplet className={className}/>;
        case 4: return <NoteSixteenths className={className}/>;
        default: return null;
      }
    };

    const getDefaultBeatSounds = (num) => {
      if (num===2) return [2,1];
      if (num===3) return [2,1,1];
      if (num===4) return [2,1,1,1];
      if (num===5) return [2,1,2,1,1];
      if (num===6) return [2,1,1,3,1,1];
      if (num===7) return [2,1,1,2,1,2,1];
      if (num===8) return [2,1,1,3,1,1,3,1];
      if (num===9) return [2,1,1,3,1,1,3,1,1];
      if (num===12) return [2,1,1,3,1,1,2,1,1,3,1,1];
      const arr = Array(num).fill(1); arr[0]=2; return arr;
    };

    const getTempoMarking = (bpm) => {
      if (bpm<40)  return "Grave";
      if (bpm<60)  return "Largo";
      if (bpm<66)  return "Larghetto";
      if (bpm<76)  return "Adagio";
      if (bpm<108) return "Andante";
      if (bpm<120) return "Moderato";
      if (bpm<168) return "Allegro";
      if (bpm<200) return "Presto";
      return "Prestissimo";
    };

    // ==========================================
    // Tuner Hook
    // ==========================================
    // ==========================================
    // 튜너 감도 설정 (localStorage 저장)
    // ==========================================
    const DEFAULT_SETTINGS = {
      gateDb: -40,       // 이 레벨(dB) 미만 소리는 무시 (노이즈 게이트)
      clarity: 0.90,     // 주기성 신뢰도 0~1. 잡음은 낮고 악기 소리는 높음
      stableFrames: 3,   // 같은 음이 N프레임 연속이어야 표시
      smoothing: 6,      // 평균낼 프레임 수 (클수록 부드럽고 느림)
      holdMs: 400,       // 소리가 끊긴 뒤 표시 유지 시간
      minFreq: 180,      // 감지 최저 Hz (바이올린 G3 = 196Hz)
      maxFreq: 3500,     // 감지 최고 Hz
      uiMode: 'modern',  // 화면 모드: 'modern' | 'tape' | 'vintage'
    };
    const SETTINGS_KEY = 'vt.tunerSettings.v1';
    const loadSettings = () => {
      try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') }; }
      catch (_) { return { ...DEFAULT_SETTINGS }; }
    };
    const saveSettings = (v) => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(v)); } catch (_) {} };
    const rmsToDb = (r) => (r > 0 ? 20 * Math.log10(r) : -100);
    const centsBetween = (a, b) => 1200 * Math.log2(a / b);

    /* McLeod 피치 검출(NSDF). 바이올린 음역의 lag만 계산해서 가볍다.
       반환: { freq(-1=없음), clarity(0~1), rms } */
    const detectPitch = (buf, sr, minFreq, maxFreq) => {
      const N = buf.length;
      let sum = 0;
      for (let i = 0; i < N; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / N);
      if (rms < 1e-5) return { freq: -1, clarity: 0, rms };
      const minLag = Math.max(2, Math.floor(sr / maxFreq));
      const maxLag = Math.min(Math.floor(N / 2), Math.ceil(sr / minFreq));
      const nsdf = new Float32Array(maxLag + 2);
      for (let tau = 0; tau <= maxLag + 1; tau++) {
        let acf = 0, m = 0;
        for (let j = 0; j < N - tau; j++) { const a = buf[j], b = buf[j + tau]; acf += a * b; m += a * a + b * b; }
        nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
      }
      // 0 근처의 첫 양수 구간은 건너뛴다
      let tau = 1;
      while (tau < maxLag && nsdf[tau] > 0) tau++;
      if (tau < minLag) tau = minLag;
      const peaks = [];
      let best = -1, bestTau = -1;
      for (; tau <= maxLag; tau++) {
        if (nsdf[tau] > 0) {
          if (nsdf[tau] > best) { best = nsdf[tau]; bestTau = tau; }
        } else if (bestTau > 0) {
          peaks.push(bestTau); best = -1; bestTau = -1;
        }
      }
      if (bestTau > 0) peaks.push(bestTau);
      if (!peaks.length) return { freq: -1, clarity: 0, rms };
      let maxPeak = 0;
      peaks.forEach(t => { if (nsdf[t] > maxPeak) maxPeak = nsdf[t]; });
      const chosen = peaks.find(t => nsdf[t] >= 0.9 * maxPeak);
      // 포물선 보간
      const y1 = nsdf[chosen - 1], y2 = nsdf[chosen], y3 = nsdf[chosen + 1];
      const a = (y1 + y3 - 2 * y2) / 2, b = (y3 - y1) / 2;
      let T0 = chosen, clarity = y2;
      if (a < 0) { T0 = chosen - b / (2 * a); clarity = y2 - (b * b) / (4 * a); }
      return { freq: sr / T0, clarity: Math.min(1, clarity), rms };
    };

    const useTunerLogic = () => {
      const [isStarted, setIsStarted] = useState(false);
      const [pitch, setPitch] = useState(0);
      const [cents, setCents] = useState(0);
      const [stringCents, setStringCents] = useState(0);
      const [a4Freq, setA4Freq] = useState(442);
      const [tolerance, setTolerance] = useState(10);
      const [currentNote, setCurrentNote] = useState({ name:'A', octave:4, symbol:'' });
      const [closestString, setClosestString] = useState(VIOLIN_STRINGS[2]);
      const [error, setError] = useState(null);
      const [playingTone, setPlayingTone] = useState(null);

      const audioContextRef = useRef(null);
      const analyserRef    = useRef(null);
      const animationRef   = useRef(null);
      const bufferRef      = useRef(null);
      const oscillatorRef  = useRef(null);
      const gainNodeRef    = useRef(null);
      const freqHistoryRef = useRef([]);
      const a4FreqRef      = useRef(442);
      const streamRef      = useRef(null);
      const settingsRef    = useRef(loadSettings());
      const [settings, setSettingsState] = useState(settingsRef.current);
      const levelRef       = useRef({ db: -100, clarity: 0, freq: -1, gate: false, accepted: false });
      const gateOpenRef    = useRef(false);
      const candidateRef   = useRef({ freq: 0, count: 0 });
      const lastGoodRef    = useRef(0);
      const calibRef       = useRef(null);
      const startingRef    = useRef(null);

      const updateSettings = (patch) => {
        const next = { ...settingsRef.current, ...patch };
        settingsRef.current = next;
        saveSettings(next);
        setSettingsState(next);
      };
      const resetSettings = () => updateSettings({ ...DEFAULT_SETTINGS, uiMode: settingsRef.current.uiMode });

      useEffect(() => {
        ensureMic();
        const onVisibility = () => {
          if (document.visibilityState === 'hidden') stopTuner();
          else ensureMic();
        };
        const resumeAudio = () => {
          if (audioContextRef.current?.state === 'suspended') audioContextRef.current.resume();
        };
        document.addEventListener('visibilitychange', onVisibility);
        document.addEventListener('pointerdown', resumeAudio);
        return () => {
          document.removeEventListener('visibilitychange', onVisibility);
          document.removeEventListener('pointerdown', resumeAudio);
          stopTuner(); stopTone();
        };
      }, []);

      const initAudioContext = async () => {
        if (!audioContextRef.current) {
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
          gainNodeRef.current = audioContextRef.current.createGain();
          gainNodeRef.current.connect(audioContextRef.current.destination);
        }
        if (audioContextRef.current.state === 'suspended') {
          await audioContextRef.current.resume();
        }
      };

      const toggleTone = async (id, semitonesFromA4) => {
        await initAudioContext();
        if (playingTone === id) { stopTone(); return; }
        stopTone();
        haptic(15);
        const targetFreq = a4FreqRef.current * Math.pow(2, semitonesFromA4 / 12);
        const osc = audioContextRef.current.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(targetFreq, audioContextRef.current.currentTime);
        const filter = audioContextRef.current.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2500;
        osc.connect(filter);
        filter.connect(gainNodeRef.current);
        gainNodeRef.current.gain.setValueAtTime(0, audioContextRef.current.currentTime);
        gainNodeRef.current.gain.linearRampToValueAtTime(0.6, audioContextRef.current.currentTime + 0.1);
        osc.start();
        oscillatorRef.current = osc;
        setPlayingTone(id);
      };

      const stopTone = () => {
        if (oscillatorRef.current) {
          const now = audioContextRef.current.currentTime;
          gainNodeRef.current?.gain.linearRampToValueAtTime(0, now + 0.1);
          oscillatorRef.current.stop(now + 0.2);
          oscillatorRef.current = null;
        }
        setPlayingTone(null);
      };

      const update = useCallback(() => {
        if (!analyserRef.current) return;
        const S = settingsRef.current;
        const now = performance.now();
        analyserRef.current.getFloatTimeDomainData(bufferRef.current);
        const { freq: raw, clarity, rms } = detectPitch(bufferRef.current, audioContextRef.current.sampleRate, S.minFreq, S.maxFreq);
        const db = rmsToDb(rms);
        if (calibRef.current) calibRef.current.push(db);

        // 노이즈 게이트 (3dB 히스테리시스: 열릴 땐 임계값, 닫힐 땐 -3dB)
        gateOpenRef.current = gateOpenRef.current ? db > S.gateDb - 3 : db > S.gateDb;

        let accepted = false;
        if (gateOpenRef.current && raw > 0 && clarity >= S.clarity) {
          const c = candidateRef.current;
          if (c.freq && Math.abs(centsBetween(raw, c.freq)) < 50) c.count++;
          else c.count = 1;
          c.freq = raw;

          if (c.count >= S.stableFrames) {
            accepted = true;
            const hist = freqHistoryRef.current;
            const last = hist[hist.length - 1];
            if (last && Math.abs(centsBetween(raw, last)) > 50) hist.length = 0;
            hist.push(raw);
            while (hist.length > S.smoothing) hist.shift();
            const freq = hist.reduce((a, b) => a + b, 0) / hist.length;
            lastGoodRef.current = now;

            const currentA4 = a4FreqRef.current;
            const semitonesFromA4Exact = 12 * Math.log2(freq / currentA4);
            const noteNum = Math.round(semitonesFromA4Exact) + 69;
            const chromaticTargetFreq = currentA4 * Math.pow(2, Math.round(semitonesFromA4Exact) / 12);
            const chromaticCentsOff = Math.round(centsBetween(freq, chromaticTargetFreq));
            let minDiff = Infinity, closestStr = VIOLIN_STRINGS[2];
            VIOLIN_STRINGS.forEach(st => {
              const diff = Math.abs(semitonesFromA4Exact - st.semitone);
              if (diff < minDiff) { minDiff = diff; closestStr = st; }
            });
            const stringTargetFreq = currentA4 * Math.pow(2, closestStr.semitone / 12);
            const strCentsOff = Math.round(centsBetween(freq, stringTargetFreq));
            const noteIndex = (noteNum % 12 + 12) % 12;
            const octave = Math.floor(noteNum / 12) - 1;
            const fullNote = NOTE_NAMES[noteIndex];
            setPitch(freq.toFixed(1));
            setCents(chromaticCentsOff);
            setStringCents(strCentsOff);
            setClosestString(closestStr);
            setCurrentNote({
              name: fullNote.replace('#', ''),
              symbol: fullNote.includes('#') ? '#' : '',
              octave
            });
          }
        } else {
          candidateRef.current.count = 0;
        }

        if (!accepted) {
          if (lastGoodRef.current && now - lastGoodRef.current > S.holdMs) {
            lastGoodRef.current = 0;
            freqHistoryRef.current = [];
            setPitch(0); setCents(0); setStringCents(0);
          }
        }
        levelRef.current = { db, clarity, freq: raw, gate: gateOpenRef.current, accepted };
        animationRef.current = requestAnimationFrame(update);
      }, []);

      // 마이크 켜기 (이미 켜져 있으면 그대로)
      const ensureMic = async () => {
        if (streamRef.current) return true;
        if (startingRef.current) return startingRef.current;
        setError(null);
        startingRef.current = (async () => { try {
          await initAudioContext();
          if (!navigator.mediaDevices?.getUserMedia)
            throw new Error("브라우저에서 마이크 기능을 지원하지 않습니다.");
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation:false, autoGainControl:false, noiseSuppression:false }
          });
          streamRef.current = stream;
          if (audioContextRef.current.state==='suspended') await audioContextRef.current.resume();
          analyserRef.current = audioContextRef.current.createAnalyser();
          analyserRef.current.fftSize = 2048;
          bufferRef.current = new Float32Array(analyserRef.current.fftSize);
          audioContextRef.current.createMediaStreamSource(stream).connect(analyserRef.current);
          setIsStarted(true);
          update();
          return true;
        } catch (err) {
          if (err.name==='NotAllowedError'||err.name==='NotFoundError'||err.message.includes('Permission dismissed')) {
            setError("마이크 권한이 거부되었습니다.\n설정 > 앱 > Violin Tuner > 권한에서\n마이크를 허용한 뒤 다시 시도해주세요.");
          } else {
            setError("마이크를 사용할 수 없습니다: "+err.message);
          }
          setIsStarted(false);
          return false;
        } finally { startingRef.current = null; } })();
        return startingRef.current;
      };

      const startTuner = async () => {
        if (streamRef.current) { stopTuner(); return; }
        haptic(20);
        await ensureMic();
      };

      // 주변 소음 측정 → 소음 상위 5% 레벨 + 8dB 를 게이트로 설정
      const calibrateNoise = async (ms = 3000) => {
        if (!(await ensureMic())) return null;
        calibRef.current = [];
        await new Promise(r => setTimeout(r, ms));
        const samples = (calibRef.current || []).sort((a, b) => a - b);
        calibRef.current = null;
        if (!samples.length) return null;
        const noise = samples[Math.floor(samples.length * 0.95)];
        const gate = Math.round(Math.min(-10, Math.max(-80, noise + 8)));
        updateSettings({ gateDb: gate });
        haptic(20);
        return { noise: Math.round(noise), gate };
      };

      const stopTuner = () => {
        if (animationRef.current) { cancelAnimationFrame(animationRef.current); animationRef.current=null; }
        streamRef.current?.getTracks().forEach(t=>t.stop());
        streamRef.current=null;
        analyserRef.current=null;
        freqHistoryRef.current=[];
        gateOpenRef.current=false; candidateRef.current={ freq:0, count:0 }; lastGoodRef.current=0;
        levelRef.current={ db:-100, clarity:0, freq:-1, gate:false, accepted:false };
        setIsStarted(false); setPitch(0); setCents(0); setStringCents(0);
      };

      const handleReset = () => {
        stopTone();
        setA4Freq(442); a4FreqRef.current=442;
        setTolerance(10); setClosestString(VIOLIN_STRINGS[2]); setError(null);
        haptic(10);
      };

      const cycleA4Freq = () => {
        setA4Freq(prev => {
          const next = prev >= 443 ? 440 : prev+1;
          a4FreqRef.current=next;
          if (playingTone && oscillatorRef.current && audioContextRef.current) {
            let semitonesFromA4=0;
            const stringObj = VIOLIN_STRINGS.find(s=>s.name===playingTone);
            if (stringObj) {
              semitonesFromA4=stringObj.semitone;
            } else {
              const playingStrName=playingTone.replace(/[0-9]+$/,'');
              const pos=parseInt(playingTone.replace(/[^0-9]/g,''),10);
              const baseInfo=[
                {string:'E',baseIdx:4,baseOct:5},{string:'A',baseIdx:9,baseOct:4},
                {string:'D',baseIdx:2,baseOct:4},{string:'G',baseIdx:7,baseOct:3}
              ].find(i=>i.string===playingStrName);
              if (baseInfo) {
                const ni=(baseInfo.baseIdx+pos)%12;
                const os=Math.floor((baseInfo.baseIdx+pos)/12);
                semitonesFromA4=(baseInfo.baseOct+os)*12+ni-57;
              }
            }
            oscillatorRef.current.frequency.setValueAtTime(
              next*Math.pow(2,semitonesFromA4/12), audioContextRef.current.currentTime
            );
          }
          return next;
        });
        haptic(8);
      };

      const cycleTolerance = () => { setTolerance(prev=>prev>=24?4:prev+2); haptic(8); };

      return {
        isStarted, pitch, cents, stringCents, a4Freq, tolerance,
        currentNote, closestString, error, playingTone,
        startTuner, stopTuner, toggleTone, handleReset, cycleA4Freq, cycleTolerance,
        settings, updateSettings, resetSettings, levelRef, ensureMic, calibrateNoise
      };
    };

    // ==========================================
    // 1. Tuner Component
    // ==========================================
    // ==========================================
    // 현별 막대: 위 막대 = 높음(#), 아래 막대 = 낮음(♭)
    // 비선형(제곱근) 눈금 → 0 근처는 세밀하게, 멀리는 ±350센트까지 넓게
    // ==========================================
    const OPEN_STRING_COLORS = { G:'#f97316', D:'#eab308', A:'#4afc9d', E:'#38bdf8' };
    const BAR_MAX_CENTS = 350;
    const BAR_TICKS = [10, 50, 100, 200];
    const BAR_H = 'clamp(52px, 13vh, 120px)';
    const barPct = (c) => Math.min(100, Math.sqrt(Math.min(Math.abs(c), BAR_MAX_CENTS) / BAR_MAX_CENTS) * 100);

    const BarScale = ({ dir, vintage }) => (
      <div className="relative w-7" style={{ height: BAR_H }}>
        {BAR_TICKS.map(t => (
          <span key={t} className={`absolute right-0 text-[7px] font-black font-mono leading-none ${vintage?'text-[#f4e3b5]/70':'text-gray-600'}`}
            style={dir === 'up' ? { bottom: `calc(${barPct(t)}% - 3px)` } : { top: `calc(${barPct(t)}% - 3px)` }}>
            {dir === 'up' ? '+' : '−'}{t}
          </span>
        ))}
      </div>
    );

    const StringBar = ({ dir, show, pos, color, tolerance }) => {
      const up = dir === 'up';
      const anchor = up ? 'bottom' : 'top';
      return (
        <div className="relative w-[4px] bg-[#141414] rounded-full" style={{ height: BAR_H }}>
          {/* 허용 범위(초록) */}
          <div className="absolute left-1/2 -translate-x-1/2 w-[6px] rounded-full bg-[#4afc9d]/25"
            style={{ [anchor]: 0, height: `${barPct(tolerance)}%` }}/>
          {BAR_TICKS.map(t => (
            <div key={t} className={`absolute left-1/2 -translate-x-1/2 h-[1px] ${t === 100 ? 'w-4 bg-gray-600' : 'w-2.5 bg-gray-800'}`}
              style={{ [anchor]: `${barPct(t)}%` }}/>
          ))}
          {show && (
            <>
              <div className={`absolute left-1/2 -translate-x-1/2 w-full transition-all duration-75 z-10 ${up ? 'rounded-t-sm' : 'rounded-b-sm'}`}
                style={{ [anchor]: 0, height: `${pos}%`, backgroundColor: color, boxShadow: `0 0 10px ${color}` }}/>
              <div className="absolute left-1/2 -translate-x-1/2 w-5 h-[3px] transition-all duration-75 rounded-full z-20"
                style={{ [anchor]: `calc(${pos}% - 1.5px)`, backgroundColor: color, boxShadow: `0 0 8px ${color}` }}/>
            </>
          )}
        </div>
      );
    };

    const StringBars = ({ tuner, vintage }) => {
      const { isStarted, pitch, stringCents, tolerance, closestString, playingTone, toggleTone } = tuner;
      return (
        <div className="flex justify-between items-center w-full max-w-sm pr-2 shrink-0 my-2">
          <div className="flex flex-col items-center">
            <span className="text-[9px] font-black mb-1 text-red-500/70">♯</span>
            <BarScale dir="up" vintage={vintage}/>
            <div className="h-12 my-0.5"/>
            <BarScale dir="down" vintage={vintage}/>
            <span className="text-[9px] font-black mt-1 text-blue-500/70">♭</span>
          </div>
          {VIOLIN_STRINGS.map(s => {
            const isClosest = isStarted && pitch>0 && closestString.name===s.name;
            const isPlaying = playingTone===s.name;
            const isPerfect = isClosest && Math.abs(stringCents)<=tolerance;
            const abs = Math.abs(stringCents);
            const activeColor = abs<=tolerance ? '#4afc9d' : abs<=tolerance+30 ? '#ffcc00' : '#ff4d4d';
            const showSharp = isClosest && !isPerfect && stringCents>0;
            const showFlat  = isClosest && !isPerfect && stringCents<0;
            const pos = barPct(stringCents);
            let circleClasses = vintage ? 'bg-[#2a1a0d] border-[#c9a14a]/50 text-[#f4e3b5]' : 'bg-[#1a1a1a] border-gray-600 text-gray-300';
            if (isPlaying)      circleClasses='bg-[#8b5a2b] border-[#e9c46a] text-white scale-110 shadow-[0_0_20px_rgba(233,196,106,0.4)] z-10';
            else if (isPerfect) circleClasses='bg-[#4afc9d] border-[#4afc9d] text-black scale-110 shadow-[0_0_20px_rgba(74,252,157,0.4)] z-10';
            else if (isClosest) circleClasses=(vintage?'bg-[#2a1a0d] text-white':'bg-[#1a1a1a] text-white')+' border-white scale-105 z-10';
            return (
              <div key={s.name} className={`flex flex-col items-center justify-center transition-all duration-300 w-12 ${isClosest||isPlaying?'opacity-100':'opacity-70'}`}>
                <span className={`text-[10px] font-black mb-1 h-3 leading-3 font-mono ${showSharp?'text-red-400':isPerfect?'text-[#4afc9d]':'text-gray-600'}`}>
                  {showSharp ? `+${stringCents}` : s.id}
                </span>
                <StringBar dir="up" show={showSharp} pos={pos} color={activeColor} tolerance={tolerance}/>
                <div className="relative my-0.5">
                  <div className={`w-12 h-12 rounded-full border-2 flex items-center justify-center text-base transition-all duration-200 font-black ${circleClasses}`}>
                    {s.note}
                    <span className="text-[8px] absolute top-1.5 right-2.5 opacity-70">{s.octave}</span>
                  </div>
                  <button onClick={()=>toggleTone(s.name,s.semitone)}
                    className={`absolute -bottom-1 -right-1 w-5 h-5 rounded-full border flex items-center justify-center transition-all z-20 ${isPlaying?'bg-yellow-500 border-yellow-400 text-black':'bg-[#151515] border-gray-700 text-gray-500'}`}>
                    {isPlaying ? <VolumeX size={10}/> : <Volume2 size={10}/>}
                  </button>
                </div>
                <StringBar dir="down" show={showFlat} pos={pos} color={activeColor} tolerance={tolerance}/>
                <span className={`text-[10px] font-black mt-1 h-3 leading-3 font-mono ${showFlat?'text-blue-400':'text-transparent'}`}>
                  {showFlat ? stringCents : '0'}
                </span>
              </div>
            );
          })}
        </div>
      );
    };

    // ==========================================
    // 하단 음 테이프: 음이름이 적힌 테이프가 좌우로 흐르고 가운데 바늘이 고정
    // 왼쪽 = 낮은 음, 오른쪽 = 높은 음. 바늘이 음 이름 오른쪽이면 높음(♯)
    // ==========================================
    const TAPE_SP = 112;   // 반음 간격(px) → 10센트 ≈ 11px

    const DrumDigits = ({ text, vintage }) => (
      <div className="flex items-end gap-[3px]">
        {text.split('').map((ch, i) => ch === '.' ? (
          <span key={i} className={`text-lg font-black leading-none pb-1 ${vintage?'text-[#3b2a1a]':'text-gray-500'}`}>.</span>
        ) : (
          <span key={i} className="w-[22px] h-8 rounded-[4px] flex items-center justify-center font-mono text-lg font-black"
            style={vintage
              ? { background:'linear-gradient(180deg,#bdbdbd,#fff 30%,#fff 70%,#a8a8a8)', color:'#111', border:'1px solid #3b2a1a', boxShadow:'inset 0 2px 3px rgba(0,0,0,.35)' }
              : { background:'linear-gradient(180deg,#000,#1c1c1c 35%,#1c1c1c 65%,#000)', color:'#e5e5e5', border:'1px solid #262626' }}>
            {ch}
          </span>
        ))}
        <span className={`ml-1 text-xs font-black pb-1 ${vintage?'text-[#3b2a1a]':'text-gray-500'}`}>Hz</span>
      </div>
    );

    const Screw = ({ className }) => (
      <span className={`absolute w-3 h-3 rounded-full ${className}`}
        style={{ background:'radial-gradient(circle at 35% 35%,#fff6d0,#b8902f 55%,#6b4a12)', boxShadow:'0 1px 2px rgba(0,0,0,.6)' }}>
        <span className="absolute inset-x-[2px] top-1/2 h-[1.5px] -translate-y-1/2 rotate-45 bg-[#5a3d0c]/80"/>
      </span>
    );

    const NoteTape = ({ tuner, vintage }) => {
      const { isStarted, pitch, a4Freq, cents, tolerance } = tuner;
      const active = isStarted && pitch > 0;
      const semiRef = useRef(0);
      if (active) semiRef.current = 12 * Math.log2(pitch / a4Freq);
      const semi = semiRef.current;
      const base = Math.round(semi);
      const keys = [];
      for (let k = base - 3; k <= base + 3; k++) keys.push(k);
      const inTune = active && Math.abs(cents) <= tolerance;
      const hz = (pitch > 0 ? Number(pitch) : 0).toFixed(1).padStart(6, '0');
      const ink = vintage ? '#3b2a1a' : '#e5e5e5';

      const tape = (
        <div className="relative w-full h-[92px] overflow-hidden rounded-lg"
          style={vintage
            ? { background:'#1d1d1d', border:'3px solid #6b4a12', boxShadow:'inset 0 3px 8px rgba(0,0,0,.8)' }
            : { background:'#050505', border:'1px solid rgba(255,255,255,.06)', boxShadow:'inset 0 2px 15px rgba(0,0,0,1)' }}>
          {/* 눈금 줄 (위) */}
          <div className="absolute inset-x-0 top-0 h-7" style={{ background: vintage ? 'linear-gradient(#3a3a3a,#1f1f1f)' : '#0b0b0b' }}/>
          {/* 허용 범위 밴드 (바늘 주위 고정) */}
          <div className="absolute top-0 h-7 left-1/2 -translate-x-1/2 transition-all"
            style={{ width: `${(tolerance * 2 / 100) * TAPE_SP}px`, background: inTune ? 'rgba(74,252,157,.55)' : (vintage ? 'rgba(90,170,80,.55)' : 'rgba(74,252,157,.18)') }}/>
          {/* 음 이름 종이 띠 (아래) */}
          <div className="absolute inset-x-0 top-7 bottom-0"
            style={{ background: vintage ? 'linear-gradient(180deg,#d8d0bb,#f6f1e4 25%,#f6f1e4 70%,#c9c0a8)' : 'linear-gradient(180deg,#0e0e0e,#141414 50%,#0b0b0b)' }}/>
          {keys.map(k => {
            const idx = ((k + 9) % 12 + 12) % 12;
            const name = NOTE_NAMES[idx];
            const oct = Math.floor((k + 57) / 12);
            const x = (k - semi) * TAPE_SP;
            const isCur = active && k === base;
            return (
              <div key={k} className="absolute top-0 bottom-0 transition-transform duration-100 ease-out"
                style={{ left: '50%', width: TAPE_SP, marginLeft: -TAPE_SP / 2, transform: `translateX(${x}px)` }}>
                {/* 10센트 눈금 */}
                {Array.from({ length: 10 }, (_, j) => (
                  <div key={j} className="absolute top-0"
                    style={{ left: `${j * 10}%`, width: 1, height: j === 5 ? 18 : j % 5 === 0 ? 14 : 8,
                      background: vintage ? '#e8e8e8' : '#3f3f46', opacity: j === 0 ? 0 : 1 }}/>
                ))}
                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[2px] h-6" style={{ background: vintage ? '#fff' : '#a1a1aa' }}/>
                {/* 음 이름 */}
                <div className="absolute left-0 right-0 top-7 bottom-0 flex items-center justify-center">
                  <span className="font-black leading-none" style={{
                    fontFamily: vintage ? 'Georgia, "Times New Roman", serif' : undefined,
                    fontSize: 34, color: vintage ? ink : (isCur ? (inTune ? '#4afc9d' : '#fff') : '#52525b'),
                    textShadow: vintage ? '0 1px 0 rgba(255,255,255,.6)' : 'none' }}>
                    {name[0]}<sup className="text-lg align-top">{name[1] === '#' ? '♯' : ''}</sup>
                    <sub className="text-[11px] opacity-50 align-baseline ml-0.5">{oct}</sub>
                  </span>
                </div>
              </div>
            );
          })}
          {/* 양쪽 그림자(원통 느낌) */}
          <div className="absolute inset-0 pointer-events-none" style={{ background: vintage
            ? 'linear-gradient(90deg,rgba(0,0,0,.75),transparent 22%,transparent 78%,rgba(0,0,0,.75))'
            : 'linear-gradient(90deg,#000,transparent 25%,transparent 75%,#000)' }}/>
          {/* 바늘 */}
          <div className="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-[3px] z-10"
            style={{ background: inTune ? '#4afc9d' : '#e11d2a', boxShadow: `0 0 8px ${inTune ? '#4afc9d' : '#e11d2a'}`, opacity: active ? 1 : 0.35 }}/>
          <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 w-3 h-3 rotate-45 z-10"
            style={{ background: vintage ? '#c9a14a' : '#52525b' }}/>
          <span className="absolute top-1 left-2 text-[9px] font-black z-10" style={{ color: vintage ? '#bbb' : '#52525b' }}>♭ LOW</span>
          <span className="absolute top-1 right-2 text-[9px] font-black z-10" style={{ color: vintage ? '#bbb' : '#52525b' }}>HIGH ♯</span>
        </div>
      );

      const centsText = active ? (cents > 0 ? `+${cents}` : `${cents}`) : '0';
      const centsColor = !active ? (vintage ? '#7a6340' : '#27272a') : inTune ? (vintage ? '#1f7a2e' : '#4afc9d') : cents > 0 ? '#ef4444' : '#3b82f6';
      const footer = (
        <div className="flex items-center justify-center gap-4 mt-2">
          <DrumDigits text={hz} vintage={vintage}/>
          <div className="flex items-baseline gap-0.5 min-w-[56px]">
            <span className="text-xl font-black font-mono" style={{ color: centsColor }}>{centsText}</span>
            <span className="text-[10px] font-black" style={{ color: vintage ? '#5a4322' : '#52525b' }}>¢</span>
          </div>
        </div>
      );

      if (!vintage) {
        return <div className="w-full max-w-sm shrink-0 mt-2 pb-1">{tape}{footer}</div>;
      }
      return (
        <div className="relative w-full max-w-sm shrink-0 mt-2 mb-1 px-5 pt-4 pb-3 rounded-[28px]"
          style={{ background:'linear-gradient(180deg,#f3dc93,#d4ad55 30%,#b88a35 55%,#e6c879 85%,#c79b45)',
                   border:'2px solid #6b4a12', boxShadow:'0 10px 30px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.25)' }}>
          <Screw className="top-2 left-2"/><Screw className="top-2 right-2"/>
          <Screw className="bottom-2 left-2"/><Screw className="bottom-2 right-2"/>
          {tape}{footer}
        </div>
      );
    };

    const CentsMeter = ({ tuner }) => {
      const { isStarted, pitch, cents, tolerance } = tuner;
      return (
        <div className="w-full max-w-sm h-28 shrink-0 flex flex-col justify-end gap-3 pb-1 mt-2">
          <div className="flex justify-center items-center gap-4 bg-[#050505] py-2.5 rounded-3xl border border-white/5 shadow-[inset_0_2px_15px_rgba(0,0,0,1)]">
            <div className={`text-4xl font-black font-mono tracking-tighter transition-all duration-300 ${isStarted&&pitch>0?(Math.abs(cents)<=tolerance?'text-[#4afc9d]':cents>0?'text-red-500':'text-blue-500'):'text-[#111]'}`}>
              {isStarted&&pitch>0?(cents>0?`+${cents}`:cents):'0'}
            </div>
            <div className="flex flex-col border-l border-gray-800 pl-3">
              <span className="text-[10px] text-gray-500 font-black uppercase tracking-widest italic">Cents</span>
              <span className="text-[10px] text-gray-700 font-bold uppercase tracking-widest">Offset</span>
            </div>
          </div>
          <div className="flex justify-between items-end gap-1 px-1 h-6">
            {CENT_STEPS.map(step => {
              const isTarget = isStarted&&pitch>0&&Math.abs(cents-step)<=5;
              return (
                <div key={step} className="flex flex-col items-center flex-1">
                  <div className={`w-full transition-all duration-200 rounded-sm ${isTarget?'h-6 bg-white shadow-[0_0_15px_white]':'h-1.5 bg-gray-900'}`}
                    style={step===0&&!isTarget?{backgroundColor:'#333'}:{}}/>
                  <span className={`text-[7px] mt-1.5 font-black ${isTarget?'text-white':'text-gray-800'}`}>{step===0?'0':step}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // 화면 모드 정의 (설정에서 선택)
    const UI_MODES = [
      { id:'modern',  name:'모던',   desc:'센트 막대 미터' },
      { id:'tape',    name:'테이프', desc:'흐르는 음 테이프' },
      { id:'vintage', name:'빈티지', desc:'황동·원목 아날로그' },
    ];
    const WOOD_BG = 'repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 2px, transparent 2px 7px, rgba(255,255,255,.03) 7px 9px, transparent 9px 15px), linear-gradient(180deg,#6e4220,#4a2a12 60%,#3a200d)';

    const ModePreview = ({ id }) => {
      if (id === 'modern') return (

    // ==========================================

    const useMetronomeLogic = () => {
      const [bpm, setBpm] = useState(60);
      const [isPlayingMetro, setIsPlayingMetro] = useState(false);
      const [currentBeat, setCurrentBeat] = useState(0);
      const [timeSig, setTimeSig] = useState({ num:4, den:4 });
      const [beatSounds, setBeatSounds] = useState([2,1,1,1]);
      const [beatSubdivisions, setBeatSubdivisions] = useState([1,1,1,1]);
      const [visualFlash, setVisualFlash] = useState(false);
      const isPlayingRef     = useRef(false);
      const bpmRef           = useRef(bpm);
      const metroAudioCtxRef = useRef(null);
      const nextNoteTimeRef  = useRef(0.0);
      const currentBeatRef   = useRef(0);
      const currentSubBeatRef = useRef(0);
      const timerIDRef       = useRef(null);
      const timeSigRef       = useRef(timeSig);
      const beatSoundsRef    = useRef(beatSounds);
      const beatSubdivisionsRef = useRef(beatSubdivisions);
      const pressTimeoutRef  = useRef(null);
      const pressIntervalRef = useRef(null);
      const lookahead = 25.0;
      const scheduleAheadTime = 0.1;

      useEffect(() => () => { stopMetronome(); handlePressEnd(); }, []);
      useEffect(() => {
        timeSigRef.current=timeSig; beatSoundsRef.current=beatSounds; beatSubdivisionsRef.current=beatSubdivisions;
        if (currentBeat>=timeSig.num) { setCurrentBeat(0); currentBeatRef.current=0; }
      }, [timeSig, beatSounds, beatSubdivisions, currentBeat]);
      useEffect(() => { bpmRef.current=bpm; }, [bpm]);

      const initMetroAudioContext = () => {
        if (!metroAudioCtxRef.current) metroAudioCtxRef.current = new (window.AudioContext||window.webkitAudioContext)();
        if (metroAudioCtxRef.current.state==='suspended') metroAudioCtxRef.current.resume();
      };

      const restartMetroIfNeeded = () => {
        if (isPlayingRef.current) { stopMetronome(); setTimeout(startMetronome, 50); }
      };

      const changeNumerator = (delta) => {
        setTimeSig(prev => {
          const nextNum=Math.max(1,Math.min(16,prev.num+delta));
          setBeatSounds(getDefaultBeatSounds(nextNum));
          setBeatSubdivisions(prevSub => {
            const nextSub=[...prevSub];
            if (nextNum>nextSub.length) for (let i=nextSub.length;i<nextNum;i++) nextSub.push(1);
            else nextSub.length=nextNum;
            return nextSub;
          });
          return { ...prev, num:nextNum };
        });
        restartMetroIfNeeded(); haptic(8);
      };

      const changeDenominator = (delta) => {
        setTimeSig(prev => {
          const opts=[2,4,8,16];
          let idx=(opts.indexOf(prev.den)+delta)%opts.length;
          if (idx<0) idx+=opts.length;
          return { ...prev, den:opts[idx] };
        });
        restartMetroIfNeeded(); haptic(8);
      };

      const toggleBeatSubdivision = (index) => {
        setBeatSubdivisions(prev => {
          const next=[...prev];
          next[index]=next[index]===4?1:next[index]+1;
          return next;
        });
        restartMetroIfNeeded(); haptic(8);
      };

      const toggleBeatSound = (index) => {
        setBeatSounds(prev => {
          const next=[...prev];
          const cur=next[index];
          if (cur===2) next[index]=3;
          else if (cur===3) next[index]=1;
          else if (cur===1) next[index]=0;
          else next[index]=2;
          return next;
        });
        haptic(8);
      };

      const nextNote = () => {
        const currentBeatSubdiv=beatSubdivisionsRef.current[currentBeatRef.current]||1;
        const secondsPerBeat=(60.0/bpmRef.current)*(4/timeSigRef.current.den);
        nextNoteTimeRef.current+=secondsPerBeat/currentBeatSubdiv;
        currentSubBeatRef.current++;
        if (currentSubBeatRef.current>=currentBeatSubdiv) {
          currentSubBeatRef.current=0;
          currentBeatRef.current=(currentBeatRef.current+1)%timeSigRef.current.num;
        }
      };

      const scheduleNote = (beatNumber, subBeatNumber, time) => {
        const delay=(time-metroAudioCtxRef.current.currentTime)*1000;
        if (subBeatNumber===0) {
          setTimeout(()=>{
            if (!isPlayingRef.current) return;
            setCurrentBeat(beatNumber); setVisualFlash('main');
            setTimeout(()=>{ if (isPlayingRef.current) setVisualFlash(false); },150);
          }, Math.max(0,delay));
        } else {
          setTimeout(()=>{
            if (!isPlayingRef.current) return;
            setVisualFlash('sub');
            setTimeout(()=>{ if (isPlayingRef.current) setVisualFlash(false); },100);
          }, Math.max(0,delay));
        }
        const soundType=subBeatNumber===0?beatSoundsRef.current[beatNumber]:-1;
        if (soundType>0||soundType===-1) {
          const osc=metroAudioCtxRef.current.createOscillator();
          const gain=metroAudioCtxRef.current.createGain();
          osc.type='square';
          let freq=1000, vol=1.0;
          if (soundType===2)  { freq=2000; vol=1.0; }
          else if (soundType===3) { freq=1500; vol=0.85; }
          else if (soundType===1) { freq=1000; vol=0.7; }
          else if (soundType===-1){ freq=1200; vol=0.5; }
          osc.frequency.value=freq;
          gain.gain.setValueAtTime(vol,time);
          const dur=soundType===-1?0.02:0.04;
          gain.gain.exponentialRampToValueAtTime(0.001,time+dur);
          osc.connect(gain); gain.connect(metroAudioCtxRef.current.destination);
          osc.start(time); osc.stop(time+dur+0.01);
        }
      };

      const scheduler = () => {
        if (!isPlayingRef.current) return;
        while (nextNoteTimeRef.current < metroAudioCtxRef.current.currentTime+scheduleAheadTime) {
          scheduleNote(currentBeatRef.current,currentSubBeatRef.current,nextNoteTimeRef.current);
          nextNote();
        }
        timerIDRef.current=window.setTimeout(scheduler,lookahead);
      };

      const startMetronome = () => {
        if (isPlayingRef.current) return;
        window.clearTimeout(timerIDRef.current);
        initMetroAudioContext();
        haptic(20);
        isPlayingRef.current=true; setIsPlayingMetro(true);
        currentBeatRef.current=0; currentSubBeatRef.current=0; setCurrentBeat(0);
        nextNoteTimeRef.current=metroAudioCtxRef.current.currentTime+0.05;
        scheduler();
      };

      const stopMetronome = () => {
        isPlayingRef.current=false; setIsPlayingMetro(false);
        window.clearTimeout(timerIDRef.current); setCurrentBeat(-1);
        haptic(10);
      };

      const toggleMetronome = () => { isPlayingRef.current?stopMetronome():startMetronome(); };
      const handleBpmChange = (e) => setBpm(Number(e.target.value));
      const changeBpmBy = (amount) => setBpm(prev=>Math.min(Math.max(30,prev+amount),250));
      const handlePressStart = (delta) => {
        changeBpmBy(delta); haptic(8);
        pressTimeoutRef.current=setTimeout(()=>{
          pressIntervalRef.current=setInterval(()=>{
            setBpm(prev=>Math.min(Math.max(30,prev+delta),250));
          },70);
        },300);
      };
      const handlePressEnd = () => { clearTimeout(pressTimeoutRef.current); clearInterval(pressIntervalRef.current); };

      return {
        bpm, setBpm, isPlayingMetro, currentBeat, timeSig, beatSounds, beatSubdivisions, visualFlash,
        toggleMetronome, changeNumerator, changeDenominator, toggleBeatSubdivision, toggleBeatSound,
        handleBpmChange, handlePressStart, handlePressEnd
      };
    };

    // ==========================================
    // 2. Metronome Component
    // ==========================================
    const Metronome = ({ metro }) => {
      const {
        bpm, isPlayingMetro, currentBeat, timeSig, beatSounds, beatSubdivisions, visualFlash,
        toggleMetronome, changeNumerator, changeDenominator, toggleBeatSubdivision, toggleBeatSound,
        handleBpmChange, handlePressStart, handlePressEnd
      } = metro;

      return (
        <div className="w-full h-full flex flex-col items-center tab-enter gap-3">
          <div className="w-full flex-1 rounded-[2.5rem] bg-[#080808] border border-white/5 shadow-[0_20px_60px_rgba(0,0,0,0.8)] flex flex-col items-center py-4 px-3 relative min-h-0">
            {/* Time signature */}
            <div className="w-full flex flex-col gap-2 shrink-0">
              <div className="flex items-center justify-between w-full px-2">
                <div className="flex flex-col items-center bg-[#111] p-1 rounded-2xl border border-gray-800 w-14">
                  <button onClick={()=>changeNumerator(1)} className="text-gray-500 active:text-white transition-colors p-1"><ChevronUp size={20}/></button>
                  <span className="text-xl font-black text-white leading-none my-0.5">{timeSig.num}</span>
                  <button onClick={()=>changeNumerator(-1)} className="text-gray-500 active:text-white transition-colors p-1"><ChevronDown size={20}/></button>
                </div>
                <span className="text-2xl font-black text-gray-700 italic">/</span>
                <div className="flex flex-col items-center bg-[#111] p-1 rounded-2xl border border-gray-800 w-14">
                  <button onClick={()=>changeDenominator(1)} className="text-gray-500 active:text-white transition-colors p-1"><ChevronUp size={20}/></button>
                  <span className="text-xl font-black text-[#4afc9d] leading-none my-0.5">{timeSig.den}</span>
                  <button onClick={()=>changeDenominator(-1)} className="text-gray-500 active:text-white transition-colors p-1"><ChevronDown size={20}/></button>
                </div>
              </div>
            </div>

            {/* Beat grid */}
            <div
              className={`grid justify-center justify-items-center w-full px-1 shrink-0 transition-all duration-300 ${beatSounds.length>8?'gap-x-1.5 gap-y-2 mt-3':'gap-x-2 mt-4'}`}
              style={{gridTemplateColumns:`repeat(${Math.min(beatSounds.length,8)},minmax(0,auto))`}}>
              {beatSounds.map((s,i) => {
                const isThisBeatFired=(i===currentBeat)&&(visualFlash==='main');
                const currentSubVal=beatSubdivisions[i];
                const isDense=beatSounds.length>8;
                return (
                  <div key={i} className={`flex flex-col items-center ${isDense?'gap-1':'gap-2'}`}>
                    <button onClick={()=>toggleBeatSound(i)}
                      className={`${isDense?'w-7 h-7 border-[1.5px]':'w-9 h-9 border-2'} rounded-full transition-all duration-100 ${isThisBeatFired?'scale-110 ring-2 ring-white/30 ring-offset-2 ring-offset-[#080808]':''} ${
                        s===2?'bg-[#ffcc00] border-[#ffcc00] shadow-[0_0_15px_#ffcc00]':
                        s===3?'bg-[#f97316] border-[#f97316] shadow-[0_0_12px_#f97316]':
                        s===1?'bg-[#4afc9d] border-[#4afc9d] shadow-[0_0_10px_#4afc9d]':
                        'bg-transparent border-gray-700'
                      }`}/>
                    <button onClick={()=>toggleBeatSubdivision(i)} className="text-gray-500 active:text-[#4afc9d] transition-colors">
                      {renderSubdivisionIcon(currentSubVal, isDense?"h-5 w-auto":"h-7 w-auto")}
                    </button>
                  </div>
                );
              })}
            </div>

            {/* Flash ball */}
            <div className="flex-1 w-full flex items-center justify-center my-2 min-h-0">
              {(() => {
                const isActiveBeatSound=currentBeat>=0&&beatSounds[currentBeat]>0;
                const beatSoundType=currentBeat>=0?beatSounds[currentBeat]:0;
                let pulseClass='bg-[#151515] border-4 border-[#080808] shadow-[inset_0_4px_10px_rgba(0,0,0,0.8)] scale-90';
                if (visualFlash==='main'&&isActiveBeatSound) {
                  if (beatSoundType===2) pulseClass='bg-[#ffcc00] shadow-[0_0_40px_#ffcc00] scale-125 border-transparent';
                  else if (beatSoundType===3) pulseClass='bg-[#f97316] shadow-[0_0_35px_#f97316] scale-[1.15] border-transparent';
                  else pulseClass='bg-[#4afc9d] shadow-[0_0_30px_#4afc9d] scale-110 border-transparent';
                } else if (visualFlash==='sub') {
                  pulseClass='bg-[#0ea5e9] shadow-[0_0_25px_#0ea5e9] scale-105 border-transparent';
                }
                return (
                  <div className={`w-16 h-16 rounded-full transition-all duration-100 ease-out flex items-center justify-center ${pulseClass}`}>
                    <div className="w-6 h-6 rounded-full bg-white/20 mix-blend-overlay"/>
                  </div>
                );
              })()}
            </div>

            {/* BPM display */}
            <div className="flex flex-col items-center shrink-0 mb-1">
              <span className="text-[40px] font-black leading-none tracking-tighter text-white">{bpm}</span>
              <span className="text-[8px] font-bold text-[#ffcc00]/80 tracking-widest uppercase mt-1">{getTempoMarking(bpm)}</span>
            </div>
          </div>

          {/* Controls */}
          <div className="w-full flex flex-col gap-2.5 shrink-0">
            <div className="flex justify-between items-center gap-2">
              <button onPointerDown={()=>handlePressStart(-1)} onPointerUp={handlePressEnd} onPointerLeave={handlePressEnd}
                style={{touchAction:'none'}}
                className="w-13 h-13 w-12 h-12 rounded-xl bg-[#111] border border-gray-800 flex items-center justify-center active:bg-gray-800 transition-colors shrink-0">
                <Minus size={20} className="text-gray-400 pointer-events-none"/>
              </button>
              <button onClick={toggleMetronome}
                className={`flex-1 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 shadow-xl border-[2px] ${isPlayingMetro?'bg-[#ffcc00]/10 border-[#ffcc00]/30 text-[#ffcc00]':'bg-[#4afc9d]/10 border-[#4afc9d]/30 text-[#4afc9d]'}`}>
                {isPlayingMetro ? <Square size={20} fill="currentColor"/> : <Play size={20} fill="currentColor" className="translate-x-1"/>}
              </button>
              <button onPointerDown={()=>handlePressStart(1)} onPointerUp={handlePressEnd} onPointerLeave={handlePressEnd}
                style={{touchAction:'none'}}
                className="w-12 h-12 rounded-xl bg-[#111] border border-gray-800 flex items-center justify-center active:bg-gray-800 transition-colors shrink-0">
                <Plus size={20} className="text-gray-400 pointer-events-none"/>
              </button>
            </div>
            <div className="flex items-center bg-[#0a0a0a] py-3 px-4 rounded-[1.5rem] border border-gray-800 shadow-inner">
              <input type="range" min="30" max="250" value={bpm} onChange={handleBpmChange} className="w-full cursor-pointer"/>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 3. Fingerboard Component
    // ==========================================
    const Fingerboard = ({ tuner, metro }) => {
      const [selectedKey, setSelectedKey] = useState('C Major (0)');
      const currentScale = KEY_SIGNATURES[selectedKey];
      const detectedStr = (tuner.isStarted&&tuner.pitch>0) ? tuner.currentNote.name+tuner.currentNote.symbol : null;
      const detectedOctave = tuner.isStarted ? tuner.currentNote.octave : null;
      const displayStrings = [...FINGERBOARD_STRINGS_EXT].reverse();

      return (
        <div className="w-full h-full flex flex-col tab-enter gap-2">
          {/* Header bar */}
          <div className="w-full flex justify-between items-center h-10 shrink-0 px-1">
            <div className="flex items-center gap-1.5 bg-[#1a1a1a] border border-gray-800 px-3 py-1.5 rounded-full text-[10px] font-bold shadow-md">
              <span className="text-gray-400">조표=</span>
              <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}
                className="bg-transparent text-white font-mono text-[10px] outline-none cursor-pointer">
                {Object.keys(KEY_SIGNATURES).map(k=>(
                  <option key={k} value={k} className="bg-[#1a1a1a] text-white">{k}</option>
                ))}
              </select>
            </div>
            <div className="flex items-center gap-2 pr-1">
              {tuner.isStarted && (
                <div className="flex items-center gap-1.5">
                  <div className={`w-2 h-2 rounded-full animate-pulse ${detectedStr?(Math.abs(tuner.cents)<=tuner.tolerance?'bg-[#4afc9d]':'bg-[#ff4d4d]'):'bg-[#4afc9d]'}`}/>
                  <span className={`text-[11px] font-black tracking-widest ${Math.abs(tuner.cents)<=tuner.tolerance?'text-[#4afc9d]':'text-[#ff4d4d]'}`}>
                    {detectedStr?`${detectedStr}${detectedOctave}`:'ON'}
                  </span>
                </div>
              )}
              {tuner.isStarted && <div className="w-[1px] h-3 bg-gray-700"/>}
              {(() => {
                let cls='bg-gray-800 text-gray-400 border border-gray-700';
                if (metro.isPlayingMetro) {
                  const bt=metro.currentBeat>=0?metro.beatSounds[metro.currentBeat]:0;
                  if (metro.visualFlash==='main') {
                    if (bt===2) cls='bg-[#ffcc00] text-black shadow-[0_0_15px_#ffcc00] scale-110 border-transparent';
                    else if (bt===3) cls='bg-[#f97316] text-black shadow-[0_0_12px_#f97316] scale-110 border-transparent';
                    else cls='bg-[#4afc9d] text-black shadow-[0_0_10px_#4afc9d] scale-105 border-transparent';
                  } else if (metro.visualFlash==='sub') cls='bg-[#0ea5e9] text-white shadow-[0_0_10px_#0ea5e9] scale-105 border-transparent';
                }
                return (
                  <button onClick={metro.toggleMetronome}
                    className={`flex items-center justify-center gap-1.5 px-2.5 py-1 rounded-full transition-all duration-75 ${cls}`}>
                    <span className="text-[10px] font-black">{metro.bpm}</span>
                    {metro.isPlayingMetro ? <Square size={10} fill="currentColor"/> : <Play size={10} fill="currentColor" className="translate-x-[0.5px]"/>}
                  </button>
                );
              })()}
            </div>
          </div>

          {/* Fingerboard */}
          <div className="w-full flex-1 rounded-2xl bg-[#050505] border border-gray-800 flex flex-col relative px-2 py-2 min-h-0 shadow-[0_10px_40px_rgba(0,0,0,0.8)]">
            <div className="flex w-full items-center mb-1 z-20 shrink-0">
              {displayStrings.map(s=>(
                <div key={s.string} className="flex-1 flex justify-center">
                  <span className="bg-[#1a1a1a] border border-gray-700 text-[#ffcc00] text-[9px] font-black px-2 py-0.5 rounded shadow-md">{s.string}</span>
                </div>
              ))}
            </div>
            <div className="flex-1 flex w-full relative z-10 min-h-0">
              {/* Guide lines */}
              <div className="absolute inset-0 flex flex-col justify-between pointer-events-none z-0 px-2">
                {Array.from({length:26}).map((_,i)=>(
                  <div key={`line-${i}`} className="flex-1 flex items-center w-full">
                    <div className={`w-full rounded-full ${(i===0||i%5===0)?'border-t-[3px] border-solid border-[#0ea5e9]/60 shadow-[0_0_8px_rgba(14,165,233,0.4)]':'border-t-[1.5px] border-dashed border-gray-600/50'}`}/>
                  </div>
                ))}
              </div>
              {/* String columns */}
              {displayStrings.map((s,idx)=>(
                <div key={s.string} className="flex-1 flex flex-col items-center relative h-full">
                  <div className={`absolute top-0 bottom-0 bg-gray-600 rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,1)] z-0 ${idx===0?'w-[5px]':idx===1?'w-[4px]':idx===2?'w-[2.5px]':'w-[1.5px]'}`}/>
                  <div className="flex-1 w-full flex flex-col justify-between z-10">
                    {Array.from({length:26}).map((_,pos)=>{
                      const note=s.notes[pos];
                      const matchedScaleNote=note.names.find(n=>currentScale.includes(n));
                      const inScale=!!matchedScaleNote;
                      const isOpenString=note.pos===0;
                      const isDetected=detectedStr&&note.names.includes(detectedStr)&&note.octave===detectedOctave;
                      const isPlaying=tuner.playingTone===note.id;
                      const semitonesFromA4=(note.octave*12+note.noteIndex)-57;
                      if (!inScale&&!isDetected&&!isPlaying) {
                        return (
                          <div key={pos} className="flex-1 flex items-center justify-center">
                            <div className="w-2 h-2 rounded-full bg-gray-700/80 cursor-pointer active:bg-[#8b5a2b]" onClick={()=>tuner.toggleTone(note.id,semitonesFromA4)}/>
                          </div>
                        );
                      }
                      const isPitchPerfect=Math.abs(tuner.cents)<=tuner.tolerance;
                      let activeStyle='';
                      if (isPlaying) activeStyle='bg-[#8b5a2b] text-white shadow-[0_0_20px_rgba(233,196,106,0.6)] z-40 scale-[1.3] border-[#e9c46a] border-[1.5px]';
                      else if (isDetected) activeStyle=isPitchPerfect?'bg-[#4afc9d] text-black shadow-[0_0_20px_#4afc9d] z-30 scale-[1.3] border-transparent':'bg-[#ff4d4d] text-white shadow-[0_0_20px_#ff4d4d] z-30 scale-[1.3] border-transparent';
                      else activeStyle=isOpenString?'bg-gray-800 text-gray-200 border border-gray-500':'bg-[#151515] text-gray-300 border border-gray-700';
                      const displayName=(isDetected&&!inScale)||isPlaying?note.names[0]:matchedScaleNote;
                      const yOffsetPx=isPitchPerfect?0:Math.max(-18,Math.min(18,tuner.cents/2));
                      return (
                        <div key={pos} className="flex-1 flex items-center justify-center relative w-full">
                          <div className="relative flex items-center justify-center">
                            {isDetected&&!isPlaying&&(
                              <div className={`absolute right-full mr-1 flex flex-col items-center justify-center animate-pulse ${isPitchPerfect?'text-[#4afc9d]':'text-[#ff4d4d]'}`}
                                style={{top:'50%',transform:`translateY(calc(-50% + ${yOffsetPx}px))`}}>
                                {!isPitchPerfect&&tuner.cents<0&&<span className="text-[10px] font-black leading-none mb-[2px]">▴</span>}
                                <span className="text-[16px] leading-none">▸</span>
                                {!isPitchPerfect&&tuner.cents>0&&<span className="text-[10px] font-black leading-none mt-[2px]">▾</span>}
                              </div>
                            )}
                            <button onClick={()=>tuner.toggleTone(note.id,semitonesFromA4)}
                              className={`flex items-center justify-center font-black text-[12px] transition-all duration-100 px-1.5 py-[2px] leading-none whitespace-nowrap min-w-[28px] cursor-pointer ${isOpenString?'rounded-[4px]':'rounded-full'} ${activeStyle}`}>
                              {displayName}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {tuner.error && (
            <div className="absolute inset-0 flex items-center justify-center z-50 bg-black/60 backdrop-blur-sm rounded-2xl">
              <div className="w-[85%] bg-gray-900/95 p-6 rounded-3xl flex flex-col items-center gap-4 border border-gray-700 shadow-2xl">
                <AlertCircle size={36} className="text-red-400"/>
                <p className="text-sm text-center text-white font-bold leading-relaxed">{tuner.error}</p>
                <div className="flex gap-3 mt-2 w-full">
                  <button onClick={tuner.handleReset} className="flex-1 py-3 bg-gray-800 text-white text-sm font-bold rounded-full border border-gray-600">닫기</button>
                  <button onClick={tuner.ensureMic} className="flex-1 py-3 bg-[#4afc9d] text-black text-sm font-bold rounded-full">다시 시도</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 4. App Component
    // ==========================================
    const App = () => {
      const tuner = useTunerLogic();
      const metro = useMetronomeLogic();
      const [activeTab, setActiveTab] = useState('tuner');

      // Wake Lock: 화면 꺼짐 방지
      useEffect(() => {
        let wakeLock = null;
        const requestWakeLock = async () => {
          try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
          catch(_) {}
        };
        requestWakeLock();
        const onVisibilityChange = () => {
          if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        };
        document.addEventListener('visibilitychange', onVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', onVisibilityChange);
          wakeLock?.release().catch(()=>{});
        };
      }, []);

      const switchTab = (tab) => {
        if (tab !== activeTab) { setActiveTab(tab); haptic(12); }
      };

      const TAB_NAV = [
        { id:'tuner',       label:'Tuner',  color:'#4afc9d', Icon:Activity },
        { id:'metronome',   label:'Metro',  color:'#ffcc00', Icon:Music    },
        { id:'fingerboard', label:'Finger', color:'#0ea5e9', Icon:LayoutGrid },
      ];

      return (
        <div
          className="fixed inset-0 bg-black text-white flex flex-col items-center font-sans select-none overflow-hidden"
          style={{
            background: activeTab === 'tuner' && tuner.settings.uiMode === 'vintage' ? WOOD_BG : '#000',
            /* Respect device safe areas so content never hides behind notch/home-indicator */
            paddingLeft:  'env(safe-area-inset-left, 0px)',
            paddingRight: 'env(safe-area-inset-right, 0px)',
          }}
        >
          {/* Content area */}
          <div
            className="flex-1 w-full max-w-md flex flex-col px-4 overflow-hidden"
            style={{
              paddingTop: 'max(1rem, env(safe-area-inset-top, 0px))',
              paddingBottom: 'calc(4.5rem + env(safe-area-inset-bottom, 0px))',
            }}
          >
            <div className={activeTab==='tuner'       ? 'flex flex-col w-full h-full' : 'hidden'}><Tuner       tuner={tuner}/></div>
            <div className={activeTab==='metronome'   ? 'flex flex-col w-full h-full' : 'hidden'}><Metronome   metro={metro}/></div>
            <div className={activeTab==='fingerboard' ? 'flex flex-col w-full h-full' : 'hidden'}><Fingerboard tuner={tuner} metro={metro}/></div>
          </div>

          {/* Bottom Navigation */}
          <nav
            className="absolute bottom-0 w-full max-w-md bg-black/95 backdrop-blur-md border-t border-gray-900 pt-2 px-2 flex justify-around z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]"
            style={{ paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom, 0px))' }}
          >
            {TAB_NAV.map(({ id, label, color, Icon }) => {
              const active = activeTab === id;
              return (
                <button
                  key={id}
                  onClick={() => switchTab(id)}
                  className="flex flex-col items-center gap-0.5 py-1 px-4 rounded-2xl transition-all duration-200 active:scale-90"
                  style={{ color: active ? color : '#4b5563' }}
                >
                  {/* Active indicator dot */}
                  <div
                    className="w-1 h-1 rounded-full mb-0.5 transition-all duration-200"
                    style={{ background: active ? color : 'transparent', boxShadow: active ? `0 0 6px ${color}` : 'none' }}
                  />
                  <Icon size={22} strokeWidth={active ? 2.5 : 2}/>
                  <span
                    className="text-[9px] font-black uppercase tracking-widest transition-all duration-200"
                    style={{ color: active ? color : '#4b5563' }}
                  >
                    {label}
                  </span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    };

    // ── Mount ──
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);

    // Dismiss splash screen after first render
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 450);
      }
    }, 900);
  </script>

  <script>
    // Register service worker for offline / installable PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
